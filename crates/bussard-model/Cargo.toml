[package]
name = "bussard-model"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core KNX domain model for bussard: GA/IA/DPT/flags types, DPT codecs, YAML schema, loader, validation"

[dependencies]
serde = { workspace = true }
# JSON for the history manifest (`.bussard/history/<id>/manifest.json`) and for
# the change-set payload the MCP tools return. Already a workspace dependency.
serde_json = { workspace = true }
serde_norway = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
bitflags = { workspace = true }
# The `.bussard` bundle (issue #111): a deflate zip with a SHA-256 manifest.
# Both are already workspace dependencies (bussard-ets/-prod/-project and
# bussard-secure/-project), so the tree gains no new crate.
zip = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
