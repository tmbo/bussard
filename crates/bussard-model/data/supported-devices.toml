# The hand-kept half of bussard's device-support list (issues #1089, #1097).
# Embedded in the binary at build time, next to the generated half,
# `supported-generated.toml` (tools/supported-devices/generate.py). The
# generator never writes this file, and it skips every application listed
# here.
#
# An entry names an application program by the id the lock pins and the device
# reports (`application_id`: manufacturer, application number and version, ten
# hex digits) and puts it in one of three categories:
#
#   proven       bussard wrote a real device with this application and the
#                read-back matched. Hand-kept only.
#   likely       the evidence says the download matches ETS, but bussard has
#                not written a real device with this application. Mostly
#                generated from the ETS sweep; here only for house devices
#                whose offline oracle is identical against a house ETS capture.
#   unsupported  a known problem, naming its issue.
#
# `proven` and `likely` pass the write gate; a plan for a `likely` device says
# it is not confirmed on a real device. Every other application is refused on a
# real gateway without --allow-unsupported.
#
# Family rule: a `likely` entry needs a `proven` entry with the same `mask`
# (the family key; see docs/explanation/device-support.md). The parser and the
# generator both refuse a list that breaks it.
#
# `evidence` says what put the entry in its category:
#
#   live           flashed by bussard on a real device, read back (proven)
#   house-capture  offline oracle identical against an ETS capture of a
#                  house device (scripts/campaign/95-offline-oracle.sh)
#   sweep          the ETS sweep (tools/ets-sweep/evidence/manifest.json)
#   issue          an open issue names the problem
#
# A hand entry pairs proven with live, likely with house-capture, and
# unsupported with issue (plus `issue` and `reason`; an entry that passes the
# gate carries neither). `source` is required: an issue number (#123) or a
# dated owner statement (2026-11-12).
#
# The generator checks every entry against the sweep: `mask` must be the
# sweep's mask for the id, or, for an id the sweep never saw, `mask_source`
# cites where it comes from; a proven or likely entry with a differing sweep
# row needs `sweep_differs` citing why it still stands. The table in docs/explanation/device-support.md is rendered
# from both halves (crates/bussard-cli/tests/it/docs_consistency.rs checks it).

# Proven: flashed live in the physical-device campaign (#89) and read back.
# "Read back" there is the device's memory checksum (MCB) compared against the
# image of every object the load procedure verifies, plus the table read-back
# named in each source.

