# The application programs bussard writes without --allow-unsupported
# (issue #1089). Embedded in the binary at build time.
#
# An entry names an application program by the id the lock pins and the device
# reports (`application_id`: manufacturer, application number and version, ten
# hex digits). `evidence` says why it is on the list:
#
#   live       flashed by bussard on a real device and read back
#   capture    offline oracle identical against an ETS capture at a
#              meaningful coverage (scripts/campaign/95-offline-oracle.sh)
#   synthetic  a fabricated product of the synthetic catalogue (#596),
#              identical against its committed ETS capture
#
# `note` cites the evidence: an issue, or committed material. Add an entry
# only with evidence you can cite. The table in
# docs/explanation/device-support.md is generated from this file
# (crates/bussard-cli/tests/it/docs_consistency.rs checks it).

# House devices, offline oracle identical in every region against the ETS
