[package]
name = "bussard-project"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = ".knxproj import for bussard: AES zip + streaming XML into the model"

[dependencies]
bussard-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Streaming XML: quick-xml never builds a DOM, so 20+ MB manufacturer files
# are read with bounded memory. MIT licensed.
quick-xml = "0.36"
# WinZip-AES ZIP support (compression method 99). MIT licensed.
zip = { version = "2.4", default-features = false, features = ["aes-crypto", "deflate"] }
# ETS6 zip-password derivation: PBKDF2-HMAC-SHA256 then base64. All MIT/Apache-2.0.
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
