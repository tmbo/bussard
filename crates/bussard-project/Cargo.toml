[package]
name = "bussard-project"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The bussard key store: KNX Secure keys and the ETS keyring (.knxkeys)"

[dependencies]
bussard-model = { workspace = true }
bussard-product = { workspace = true }
# KNX Secure crypto primitives: PBKDF2 key schedule, AES-CBC decrypt, and the
# zeroizing Key16 wrapper the `.knxkeys` keyring parser needs (issue #71 §4).
bussard-secure = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Streaming XML for the `.knxkeys` keyring. Version centralized in
# `[workspace.dependencies]`.
quick-xml = { workspace = true }
# The keyring signature (SHA-256) and its base64 fields. All MIT/Apache-2.0.
sha2 = { workspace = true }
base64 = { workspace = true }
# zeroize: wipes decrypted keyring passwords (and the Latin-1 buffers derived
# from them) once the keys are derived, matching the Key16 hygiene in
# bussard-secure (issue #71 spec §2.3). MIT OR Apache-2.0.
zeroize = { workspace = true }

[lints]
workspace = true
