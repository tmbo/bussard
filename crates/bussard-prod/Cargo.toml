[package]
name = "bussard-prod"
description = ".knxprod product-data reading: application programs, parameters, load procedures"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bussard-model = { workspace = true }
bussard-ets = { workspace = true }
# Decodes `TypeRawData` parameter values (base64). Already in the tree via
# bussard-ets; MIT OR Apache-2.0.
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# YAML for the generated product models (`product_model`), moved here from the
# CLI so the MCP and viz servers regenerate them too (#267). Already in the
# tree via bussard-model.
serde_norway = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# ZIP support for the `.knxprod` container. No AES feature: unlike `.knxproj`,
# the manufacturer folders inside a `.knxprod` are not password-protected, and
# bussard never writes/signs these archives. MIT licensed. Version centralized in
# the root `[workspace.dependencies]`.
zip = { workspace = true }
# SHA-256 for verifying downloaded product data against the index checksum.
# Already in the workspace tree (bussard-project uses it for PBKDF2). MIT/Apache-2.0.
sha2 = "0.10"
# Sync HTTP client for vendor downloads. Chosen over reqwest: `ureq` is
# blocking (no async runtime pulled into this crate), tiny, and uses rustls for
# TLS with no OpenSSL system dependency. MIT OR Apache-2.0.
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = "3"
# Assemble a tiny `.knxprod` in-test; the write side needs the same crate.
zip = { workspace = true }

[lints]
workspace = true
