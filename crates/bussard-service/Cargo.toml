[package]
name = "bussard-service"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The service layer between bussard's surfaces (CLI, MCP, viz) and its domain crates: gated bus access, management sessions, the checked group write and a live model handle"

[dependencies]
bussard-model = { workspace = true }
bussard-transport = { workspace = true }
bussard-mgmt = { workspace = true }
bussard-secure = { workspace = true }
# `.knxkeys` keyring parsing for the tool-key resolver (`secure`).
bussard-project = { workspace = true }
# Regenerating missing product models under `.bussard/models/` from the
# archives the lock pins, before a model load or reload (#267). First-party.
bussard-prod = { workspace = true }
# SHA-256 keys the per-process decrypted-keyring memo (issue #214/#215) by the
# file bytes and the password, so neither is kept in the clear. Already in the
# tree (bussard-project, bussard-secure). MIT OR Apache-2.0.
sha2 = { workspace = true }
# The parameter half of a device write (issue #274): the product
# resolution, the read-back, the plan and the parameter-only download that
# `bussard apply` and the MCP programming tier share. First-party.
bussard-download = { workspace = true }
# The DPT inference `learn` and `knx_infer_group` share (issue #903).
# First-party.
bussard-monitor = { workspace = true }
# The parameter read-back report is serialized by `plan --json`. Already in
# the tree. MIT OR Apache-2.0.
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# The certificate enrolment session (issue #729): JSON messages and relay
# bodies, base64url fields, and the outbound relay client. All already in the
# tree (bussard-ha uses ureq the same way). MIT OR Apache-2.0.
serde_json = { workspace = true }
base64 = { workspace = true }
ureq = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# The enrolment outcome's JSON shape is checked in a unit test. Already in the tree.
serde_json = { workspace = true }
# The mock device the property read-back test reads from (a workspace crate).
bussard-testkit = { workspace = true }
# Fabricated .knxprod archives and download wrappers in the product-store tests.
zip = { workspace = true }

[lints]
workspace = true
