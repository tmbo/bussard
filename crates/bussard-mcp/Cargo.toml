[package]
name = "bussard-mcp"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MCP server for bussard (stdio or streamable HTTP): KNX model and bus tools"

[dependencies]
bussard-model = { workspace = true }
# The service layer (issue #86): gated bus access, management sessions, the
# checked group write and the live model handle.
bussard-service = { workspace = true }
# `.knxproj` import for `knx_diff_project` (issue #99), in memory only.
bussard-project = { workspace = true }
bussard-transport = { workspace = true }
bussard-monitor = { workspace = true }
bussard-bus = { workspace = true }
bussard-mgmt = { workspace = true }
# The table plan / backup / write flow behind the programming tier (issue #118),
# shared with `bussard plan` and `bussard apply`.
bussard-download = { workspace = true }
# The Data Secure send-sequence high-water mark for a secured plan read (#170).
bussard-secure = { workspace = true }
# The Home Assistant tier (issue #280): the KNX YAML generator, its diff and
# write, and the REST client.
bussard-ha = { workspace = true }
# The rendered automation as YAML for the human (issue #280).
serde_norway = { workspace = true }
# SHA-256 for the programming tier's plan digest. MIT OR Apache-2.0.
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The field path in a tool-argument error (#269).
serde_path_to_error = { workspace = true }
anyhow = { workspace = true }
# The official Rust MCP SDK. Apache-2.0. Server + macros + stdio transport +
# JSON-Schema generation for tool parameters. Pinned to 3.x; MSRV 1.88 < 1.98.
# `transport-streamable-http-server` serves `bussard mcp --listen` (issue #265);
# it adds rand, rand_core, chacha20, sse-stream and async-trait, all
# MIT OR Apache-2.0.
rmcp = { version = "3.3.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }
# The HTTP server and the bearer-token middleware for `--listen` (issue #265).
# Already in the tree through bussard-viz. MIT.
axum = { workspace = true }
# The local enrolment page and relay for `knx_enroll_certificates` with
# `local: true` (issue #732), shared with `bussard keys enroll --local`.
# Already in the tree through bussard-cli; no new crates.
bussard-viz = { workspace = true }
# OS randomness for the generated `--listen` bearer token. Already in the
# tree through bussard-secure. MIT OR Apache-2.0.
getrandom = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
bussard-model = { workspace = true }
bussard-monitor = { workspace = true }
bussard-transport = { workspace = true }
bussard-bus = { workspace = true }
# The client half of rmcp for the in-process integration test.
rmcp = { version = "3.3.0", features = ["server", "client", "macros", "transport-io", "schemars"] }
# A blocking HTTP client for the `--listen` tests (issue #265). Already in the
# tree through bussard-cli. MIT OR Apache-2.0.
ureq = { workspace = true }
# The fake phone of the enrolment tests encodes envelopes (issue #732).
# Already in the tree. MIT OR Apache-2.0.
base64 = { workspace = true }
# The shared mock KNXnet/IP gateway and mock devices (issue #87).
bussard-testkit = { workspace = true }
# Writes the test product models from fixture XML through the importer
# (issue #345). Already a transitive dependency via bussard-download. MIT.
bussard-prod = { workspace = true }
# Packs the synthetic `.knxprod` of the flash test (issue #303). Already in
# the tree (bussard-prod, bussard-model). MIT.
zip = { workspace = true }

[lints]
workspace = true
