[package]
name = "bussard-download"
description = "The downloader: table computation, load procedures, differential plan/apply"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bussard-model = { workspace = true }
bussard-prod = { path = "../bussard-prod" }
bussard-mgmt = { path = "../bussard-mgmt" }
bussard-bus = { workspace = true }
bussard-transport = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# The corpus conformance sweep (`sweep` module) buckets every application in a
# product corpus and serializes a stable, diffable manifest. serde/serde_json
# are library deps because the manifest types are public and used by both the
# env-gated corpus test and any tooling that regenerates the checked-in baseline.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The KNX Data Secure mock device in `tests/flash_mock.rs` (issue #71): it holds
# a `DataSecureSession` so the mock unwraps A_SecureData and wraps its responses,
# exercising the flash engine end to end through the secure seam.
bussard-secure = { workspace = true }
# For the env-gated dry-run trace test that reads the developer's local
# `home_test.knxproj` (a plain-zip container) and for the committed-fixture sweep
# test, which assembles fabricated `.app.xml` fixtures into `.knxprod` ZIPs in a
# temp dir. Not committed data; the trace test skips when absent, so CI is
# unaffected. Matches bussard-prod's dev-dependency.
zip = { version = "2.4", default-features = false, features = ["deflate"] }
# The fixture sweep test builds throwaway `.knxprod` containers in a temp dir.
tempfile = "3"
