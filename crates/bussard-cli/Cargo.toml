[package]
name = "bussard-cli"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "bussard: an open-source CLI for KNX"

[[bin]]
name = "bussard"
path = "src/main.rs"

[dependencies]
bussard-model = { workspace = true }
# The service layer (issue #86): gated bus access, management sessions, the
# checked group write and the live model handle.
bussard-service = { workspace = true }
bussard-project = { workspace = true }
bussard-prod = { workspace = true }
bussard-transport = { workspace = true }
bussard-monitor = { workspace = true }
bussard-bus = { workspace = true }
bussard-mcp = { workspace = true }
bussard-mgmt = { workspace = true }
bussard-download = { workspace = true }
# KNX Secure (issue #71): the Data Secure tool key / session for the flash seam.
bussard-secure = { workspace = true }
bussard-ha = { workspace = true }
bussard-viz = { workspace = true }
# axum: drives the `bussard viz` HTTP server (serve + graceful shutdown). MIT.
axum = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_norway = { workspace = true }
serde_json = { workspace = true }
# SHA-256 of the images `flash --dry-run --dump-images` writes (already in the
# tree via bussard-model / bussard-secure). MIT OR Apache-2.0.
sha2 = { workspace = true }
owo-colors = { workspace = true }
# Live progress display on a TTY stderr (issue #147). MIT.
indicatif = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Interactive password prompt (only used when a TTY is present). MIT licensed.
# Pinned to 7.3.x so its transitive deps build on rustc 1.82.
rpassword = "=7.3.1"

[dev-dependencies]
# The loopback mock gateway for the secured group read/write/monitor tests.
bussard-testkit = { workspace = true }
# Builds the synthetic `.knxprod` / `.knxproj` fixtures for the import-product tests.
zip = { workspace = true }
