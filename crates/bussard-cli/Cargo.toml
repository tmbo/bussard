[package]
name = "bussard-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "bussard: an open-source CLI for KNX"

[[bin]]
name = "bussard"
path = "src/main.rs"

[dependencies]
bussard-model = { workspace = true }
bussard-project = { workspace = true }
bussard-prod = { path = "../bussard-prod" }
bussard-transport = { workspace = true }
bussard-monitor = { workspace = true }
bussard-mcp = { workspace = true }
bussard-mgmt = { path = "../bussard-mgmt" }
bussard-ha = { path = "../bussard-ha" }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_norway = { workspace = true }
serde_json = { workspace = true }
owo-colors = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Interactive password prompt (only used when a TTY is present). MIT licensed.
# Pinned to 7.3.x so its transitive deps build on rustc 1.82.
rpassword = "=7.3.1"
