[package]
name = "bussard-viz"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Web visualization server for a bussard KNX installation: topology, group-address tree, and live bus traffic"

[dependencies]
# The layering rule (issue #916): a surface depends on bussard-service and
# bussard-model (and bussard-product for import and product data) only; the
# domain crates reach it through bussard-service. Tests may name them.
bussard-model = { workspace = true }
# The service layer (issue #86): gated bus access, management sessions, the
# checked group write and the live model handle.
bussard-service = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
# The in-process enrolment relay (issue #729) stores SHA-256 of each session's
# owner token, never the token. Already in the tree. MIT OR Apache-2.0.
sha2 = { workspace = true }
getrandom = { workspace = true }
qrcode = { workspace = true }

[features]
# `browser-tests`: enables tests/it/browser_smoke.rs, a headless-Chrome smoke test
# of the frontend DOM. Off by default, so the default build/test is completely
# unaffected. Run with `cargo nextest run -p bussard-viz --features browser-tests`.
#
# NOTE ON THE DEPENDENCY: the original plan proposed the `headless_chrome` crate
# to drive Chrome over CDP. It was rejected by the license gate: its build-time
# dependency `auto_generate_cdp` ships a GPL-3.0-or-later LICENSE, which
# `cargo deny check` fails (bussard must never take on a copyleft dependency).
# Instead the test drives Chrome directly as a subprocess
# (`--headless=new --dump-dom`) with std::process::Command and zero new
# dependencies. The feature therefore adds NO crates; it is a pure test gate.
browser-tests = []

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
# tower's ServiceExt::oneshot drives the router in handler unit tests without
# binding a socket; http-body-util collects response bodies. Both MIT.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# futures-util drives the SSE response body stream in the framing test. MIT.
futures-util = "0.3"
tempfile = "3"
# The bus actor and gateway settings of the unit tests.
bussard-transport = { workspace = true }
# The enrolment end-to-end test: a fake phone (the protocol crypto and the
# relay's phone-side endpoints over HTTP) against the in-process relay.
bussard-secure = { workspace = true }
base64 = { workspace = true }
ureq = { workspace = true }

[lints]
workspace = true
