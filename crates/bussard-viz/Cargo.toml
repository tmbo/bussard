[package]
name = "bussard-viz"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Web visualization server for a bussard KNX installation: topology, group-address tree, and live bus traffic"

[dependencies]
bussard-model = { workspace = true }
bussard-transport = { workspace = true }
bussard-monitor = { workspace = true }
bussard-bus = { workspace = true }
# The programming-mode watch reuses the assign broadcast-read op
# (bussard_mgmt::broadcast::devices_in_programming_mode_within) over the shared
# BusHandle lease, rather than reimplementing the A_IndividualAddress_Read probe.
bussard-mgmt = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }

[features]
# `browser-tests`: enables tests/browser_smoke.rs, a headless-Chrome smoke test
# of the frontend DOM. Off by default, so the default build/test is completely
# unaffected. Run with `cargo nextest run -p bussard-viz --features browser-tests`.
#
# NOTE ON THE DEPENDENCY: the original plan proposed the `headless_chrome` crate
# to drive Chrome over CDP. It was rejected by the license gate: its build-time
# dependency `auto_generate_cdp` ships a GPL-3.0-or-later LICENSE, which
# `cargo deny check` fails (bussard must never take on a copyleft dependency).
# Instead the test drives Chrome directly as a subprocess
# (`--headless=new --dump-dom`) with std::process::Command and zero new
# dependencies. The feature therefore adds NO crates; it is a pure test gate.
browser-tests = []

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
# tower's ServiceExt::oneshot drives the router in handler unit tests without
# binding a socket; http-body-util collects response bodies. Both MIT.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# futures-util drives the SSE response body stream in the framing test. MIT.
futures-util = "0.3"
tempfile = "3"
