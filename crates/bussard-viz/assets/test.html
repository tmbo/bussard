<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>viz self-test</title>
  <style>
    body { background: #0e1116; color: #d7dce3; font-family: ui-monospace, Menlo, monospace; padding: 20px; }
    #result { font-size: 18px; margin-bottom: 12px; }
    .pass { color: #3fb950; }
    .fail { color: #f85149; }
    ul { line-height: 1.6; }
    li.ok { color: #3fb950; }
    li.bad { color: #f85149; }
  </style>
</head>
<body>
  <h1>bussard viz — store self-test</h1>
  <div id="result">running…</div>
  <ul id="details"></ul>

  <script type="module">
    // Relative imports so this page runs from the crate (/assets/test.html or
    // /test) AND when opened directly via file:// next to its imports.
    import { Store, parseFilter, RingBuffer, rowHaystack } from "./store.js";

    let pass = 0;
    let fail = 0;
    const failures = [];
    const details = document.getElementById("details");

    /**
     * Assert a boolean condition; record pass/fail and append a list item.
     */
    function check(name, cond) {
      const li = document.createElement("li");
      if (cond) {
        pass++;
        li.className = "ok";
        li.textContent = "PASS " + name;
      } else {
        fail++;
        li.className = "bad";
        li.textContent = "FAIL " + name;
        failures.push(name);
      }
      details.appendChild(li);
    }

    // --- inline fixture (small; exercises orphan/problem logic) ------------
    const fixture = {
      project: "T",
      stats: { devices: 2, groups: 3, links: 2 },
      ranges: [{ key: "1", main: 1, middle: null, name: "Lighting" }],
      devices: [
        {
          address: "1.1.1", name: "Push Button Hallway", floor: "Ground Floor", room: "Hallway",
          product: { manufacturer: "Acme Automation", order_number: "PB-4F" },
          channels: [{ key: "CH-1", name: "A" }],
          com_objects: [
            { number: 0, name: "Switch", dpt: "1.001", flags: "C-WT--", channel: "CH-1", send: "1/1/1", listen: [] },
            { number: 1, name: "Loose", dpt: "1.001", flags: "C-----", channel: "CH-1", send: null, listen: [] }
          ]
        },
        {
          address: "1.1.2", name: "Switch Actuator", floor: "Ground Floor", room: "Utility Room",
          product: null, channels: [],
          com_objects: [
            { number: 0, name: "Switch", dpt: "1.001", flags: "C-W-U-", channel: null, send: null, listen: ["1/1/1"] }
          ]
        }
      ],
      groups: [
        { address: "1/1/1", name: "Hallway Light", dpt: "1.001", protected: false, main: 1, middle: 1, sub: 1,
          range: { main: "Lighting", middle: null },
          senders: [{ device: "1.1.1", device_name: "Push Button Hallway", object: 0, object_name: "Switch" }],
          listeners: [{ device: "1.1.2", device_name: "Switch Actuator", object: 0, object_name: "Switch" }] },
        { address: "1/1/2", name: "No listener", dpt: "1.001", protected: false, main: 1, middle: 1, sub: 2,
          range: { main: "Lighting", middle: null },
          senders: [{ device: "1.1.1", device_name: "Push Button Hallway", object: 0, object_name: "Switch" }],
          listeners: [] },
        { address: "1/2/0", name: null, dpt: null, protected: true, main: 1, middle: 2, sub: 0,
          range: { main: "Lighting", middle: null },
          senders: [], listeners: [] }
      ]
    };

    const store = new Store(fixture);

    // --- indexes ----------------------------------------------------------
    check("deviceByAddr indexed", store.deviceByAddr.get("1.1.1").name === "Push Button Hallway");
    check("groupByAddr indexed", store.groupByAddr.get("1/1/1").name === "Hallway Light");
    check("gaSenders index", store.gaSenders.get("1/1/1").length === 1);
    check("gaListeners index", store.gaListeners.get("1/1/1").length === 1);
    check("deviceGAs union", store.deviceGAs.get("1.1.1").has("1/1/1"));

    // --- problems / orphans ----------------------------------------------
    // New semantics: only one-sided *linked* GAs are problems. Unlinked com
    // objects and fully-unlinked GAs are normal and counted as neutral info.
    check("unlinked com object NOT a problem",
      !store.problems.some((p) => p.type === "unlinked-object"));
    check("ga-no-listener detected (senders, no listener)",
      store.problems.some((p) => p.type === "ga-no-listener" && p.ga === "1/1/2"));
    check("fully-unlinked GA 1/2/0 NOT a problem",
      !store.problems.some((p) => p.ga === "1/2/0"));
    check("linked GA 1/1/1 not flagged",
      !store.problems.some((p) => p.ga === "1/1/1"));
    check("total problem count is 1",
      store.problems.length === 1);
    check("info counts unused com objects", store.info.unusedComObjects === 1);
    check("info counts unused group addresses", store.info.unusedGroupAddresses === 1);
    // A GA with listeners but no sender is the mirror problem.
    const storeMirror = new Store({
      devices: [], ranges: [], stats: {},
      groups: [
        { address: "2/0/1", name: "orphan listener", senders: [],
          listeners: [{ device: "1.1.9", device_name: "X", object: 0 }] },
      ],
    });
    check("ga-no-sender detected (listeners, no sender)",
      storeMirror.problems.some((p) => p.type === "ga-no-sender" && p.ga === "2/0/1"));

    // --- suspicious -------------------------------------------------------
    check("1/1/2 is suspicious (no listener)", store.isSuspiciousGa("1/1/2"));
    check("1/1/1 not suspicious", !store.isSuspiciousGa("1/1/1"));
    check("unknown GA is suspicious", store.isSuspiciousGa("7/7/7"));

    // --- search index -----------------------------------------------------
    const r1 = store.search("flur");
    check("search hits device by room", r1.devices.some((e) => e.id === "1.1.1"));
    const r2 = store.search("gira");
    check("search hits by manufacturer", r2.devices.some((e) => e.id === "1.1.1"));
    const r3 = store.search("1/1/1");
    check("search hits GA by address", r3.groups.some((e) => e.id === "1/1/1"));
    const r4 = store.search("taster flur");
    check("search ANDs terms", r4.devices.length === 1 && r4.devices[0].id === "1.1.1");
    const r5 = store.search("taster aktor");
    check("search AND with no match", r5.devices.length === 0);

    // --- filter grammar ---------------------------------------------------
    const susp = (ga) => store.isSuspiciousGa(ga);
    const mk = (o) => Object.assign({ source: "", destination: "", apci: "", value: "", dpt: "", note: "" }, o);

    const exact = parseFilter("1/1/1", susp);
    check("filter exact GA match", exact(mk({ destination: "1/1/1" })));
    check("filter exact GA reject", !exact(mk({ destination: "1/1/2" })));

    const subMid = parseFilter("1/1/*", susp);
    check("filter subtree m/mid/* match", subMid(mk({ destination: "1/1/9" })));
    check("filter subtree m/mid/* reject", !subMid(mk({ destination: "1/2/0" })));

    const subMain = parseFilter("1/*", susp);
    check("filter subtree m/* match", subMain(mk({ destination: "1/2/0" })));
    check("filter subtree m/* reject other main", !subMain(mk({ destination: "2/0/0" })));

    const dev = parseFilter("1.1.30", susp);
    check("filter source device match", dev(mk({ source: "1.1.30" })));
    check("filter source device reject", !dev(mk({ source: "1.1.31" })));

    const rd = parseFilter("apci:read", susp);
    check("filter apci:read match", rd(mk({ apci: "read" })));
    check("filter apci:read reject write", !rd(mk({ apci: "write" })));

    const wr = parseFilter("apci:write", susp);
    check("filter apci:write match", wr(mk({ apci: "write" })));

    const isS = parseFilter("is:suspicious", susp);
    check("filter is:suspicious match", isS(mk({ destination: "1/1/2" })));
    check("filter is:suspicious reject linked", !isS(mk({ destination: "1/1/1" })));

    const txt = parseFilter("schalten", susp);
    check("filter free text match", txt(mk({ note: "Switch Hallway" })));
    check("filter free text reject", !txt(mk({ note: "Dimmen" })));

    const combo = parseFilter("1/1/* apci:write", susp);
    check("filter AND of terms match", combo(mk({ destination: "1/1/5", apci: "write" })));
    check("filter AND of terms reject", !combo(mk({ destination: "1/1/5", apci: "read" })));

    const empty = parseFilter("", susp);
    check("empty filter matches all", empty(mk({ destination: "9/9/9" })));

    check("rowHaystack lowercases", rowHaystack(mk({ note: "HELLO" })).includes("hello"));

    // --- ring buffer ------------------------------------------------------
    const ring = new RingBuffer(3);
    ring.push("a"); ring.push("b");
    check("ring partial toArray", JSON.stringify(ring.toArray()) === JSON.stringify(["a", "b"]));
    ring.push("c"); ring.push("d");
    check("ring wrap drops oldest", JSON.stringify(ring.toArray()) === JSON.stringify(["b", "c", "d"]));
    check("ring size capped", ring.size === 3);
    ring.push("e"); ring.push("f");
    check("ring wrap twice", JSON.stringify(ring.toArray()) === JSON.stringify(["d", "e", "f"]));
    ring.clear();
    check("ring clear empties", ring.size === 0 && ring.toArray().length === 0);

    const big = new RingBuffer(5000);
    for (let i = 0; i < 5200; i++) big.push(i);
    check("ring cap 5000 holds 5000", big.size === 5000);
    check("ring cap 5000 oldest correct", big.toArray()[0] === 200);

    // --- pub/sub ----------------------------------------------------------
    let got = null;
    const off = store.on("selection", (s) => { got = s; });
    store.select("ga", "1/1/1");
    check("pub/sub delivers selection", got && got.id === "1/1/1");
    off();
    store.select("ga", "1/2/0");
    check("pub/sub unsubscribe works", got.id === "1/1/1");

    // --- communication partners (item 3) ---------------------------------
    // 1.1.1 sends 1/1/1 (heard by 1.1.2); 1.1.2 listens on 1/1/1 (driven by
    // 1.1.1). So 1.1.1 and 1.1.2 are each other's only partner, sharing 1/1/1.
    const p1 = store.communicationPartners("1.1.1");
    check("partners: one partner for 1.1.1", p1.length === 1 && p1[0].device === "1.1.2");
    check("partners: shared GA listed", p1.length === 1 && p1[0].gas.includes("1/1/1"));
    const p2 = store.communicationPartners("1.1.2");
    check("partners: mirror partner for 1.1.2", p2.length === 1 && p2[0].device === "1.1.1");
    check("partners: excludes self", p1.every((p) => p.device !== "1.1.1"));
    check("partners: unknown device -> empty", store.communicationPartners("9.9.9").length === 0);

    // Direction (item 6): 1.1.1 SENDS 1/1/1 and 1.1.2 LISTENS to it, so data
    // flows OUT of 1.1.1 to 1.1.2 (outgoing) and INTO 1.1.2 from 1.1.1 (incoming).
    check("partners: direction outgoing for 1.1.1's partner", p1[0].direction === "outgoing");
    check("partners: direction incoming for 1.1.2's partner", p2[0].direction === "incoming");
    // A device that both sends and listens on GAs shared with one partner is `both`.
    const dualStore = new Store({
      ranges: [], stats: {},
      devices: [
        { address: "1.1.1", name: "A", com_objects: [
          { number: 0, send: "1/0/1", listen: ["1/0/2"] } ] },
        { address: "1.1.2", name: "B", com_objects: [
          { number: 0, send: "1/0/2", listen: ["1/0/1"] } ] },
      ],
      groups: [
        { address: "1/0/1", name: "x", senders: [{ device: "1.1.1", object: 0 }],
          listeners: [{ device: "1.1.2", object: 0 }] },
        { address: "1/0/2", name: "y", senders: [{ device: "1.1.2", object: 0 }],
          listeners: [{ device: "1.1.1", object: 0 }] },
      ],
    });
    const dp = dualStore.communicationPartners("1.1.1");
    check("partners: bidirectional partner is 'both'",
      dp.length === 1 && dp[0].device === "1.1.2" && dp[0].direction === "both");

    // gaDirections (item 6): sender 1.1.1 -> outgoing, listener 1.1.2 -> incoming.
    const gd = store.gaDirections("1/1/1");
    check("gaDirections: sender is outgoing", gd.get("1.1.1") === "outgoing");
    check("gaDirections: listener is incoming", gd.get("1.1.2") === "incoming");
    // A device that both sends and listens on the SAME GA is classified 'both'.
    const bothStore = new Store({
      ranges: [], stats: {},
      devices: [{ address: "1.1.5", name: "SL", com_objects: [
        { number: 0, send: "3/0/0", listen: ["3/0/0"] } ] }],
      groups: [{ address: "3/0/0", name: "z",
        senders: [{ device: "1.1.5", object: 0 }],
        listeners: [{ device: "1.1.5", object: 0 }] }],
    });
    check("gaDirections: send+listen device is 'both'",
      bothStore.gaDirections("3/0/0").get("1.1.5") === "both");

    // A device that only touches an unshared GA has no partners. 1/1/2 has
    // sender 1.1.1 but no listeners, so 1.1.1 gains no partner from it.
    const gaPartic = store.gaParticipants("1/1/1");
    check("gaParticipants union of sender+listener",
      gaPartic.length === 2 && gaPartic.includes("1.1.1") && gaPartic.includes("1.1.2"));
    check("gaParticipants of no-listener GA is sender only",
      JSON.stringify(store.gaParticipants("1/1/2")) === JSON.stringify(["1.1.1"]));

    // --- view-state transitions (item 6) ---------------------------------
    // A fresh store starts in 'all'.
    const vStore = new Store(fixture);
    check("view starts in 'all'", vStore.view.mode === "all");
    vStore.select("device", "1.1.1");
    check("device selection -> device-partners", vStore.view.mode === "device-partners");
    check("device-partners carries partner set",
      vStore.view.partners.length === 1 && vStore.view.partners[0].device === "1.1.2");
    check("device-partners kind/id set",
      vStore.view.kind === "device" && vStore.view.id === "1.1.1");
    vStore.select("ga", "1/1/1");
    check("ga selection -> ga-focus", vStore.view.mode === "ga-focus");
    check("ga-focus carries focus devices",
      vStore.view.focusDevices.length === 2);
    check("ga-focus kind/id set",
      vStore.view.kind === "ga" && vStore.view.id === "1/1/1");
    vStore.deselect();
    check("deselect -> all", vStore.view.mode === "all" &&
      vStore.view.partners.length === 0 && vStore.view.focusDevices.length === 0);

    // The 'view' topic fires alongside 'selection'.
    let vSeen = null;
    const offView = vStore.on("view", (v) => { vSeen = v; });
    vStore.select("device", "1.1.2");
    check("view event emitted on select", vSeen && vSeen.mode === "device-partners");
    offView();

    // --- flash-effects toggle (item 1) -----------------------------------
    // Clear any persisted preference so the default-on assertion is deterministic.
    try { localStorage.removeItem("bussard-viz.flash-effects"); } catch {}
    const fStore = new Store(fixture);
    check("flashEnabled defaults on", fStore.flashEnabled === true);
    let fSeen = null;
    fStore.on("flash-enabled", (on) => { fSeen = on; });
    check("setFlashEnabled(false) turns off", fStore.setFlashEnabled(false) === false);
    check("flash-enabled event fired", fSeen === false);
    check("toggle flips back on", fStore.setFlashEnabled() === true);

    // --- programming mode (item 4) ---------------------------------------
    const progStore = new Store(fixture);
    check("progDevices empty by default", progStore.progDevices.size === 0);
    check("isProg false by default", !progStore.isProg("1.1.2"));
    let progSeen = null;
    const offProg = progStore.on("prog", (set) => { progSeen = set; });
    progStore.setProgDevices(["1.1.2"]);
    check("setProgDevices adds device", progStore.isProg("1.1.2"));
    check("prog event fired with a Set", progSeen instanceof Set && progSeen.has("1.1.2"));
    check("progDevices size is 1", progStore.progDevices.size === 1);
    // A second update replaces the set (not additive).
    progStore.setProgDevices(["1.1.1"]);
    check("setProgDevices replaces set", progStore.isProg("1.1.1") && !progStore.isProg("1.1.2"));
    // Clearing via empty/null.
    progStore.setProgDevices([]);
    check("setProgDevices([]) clears", progStore.progDevices.size === 0);
    progStore.setProgDevices(["1.1.2"]);
    progStore.setProgDevices(null);
    check("setProgDevices(null) clears", progStore.progDevices.size === 0);
    // Coerces address values to strings and skips falsy entries.
    progStore.setProgDevices(["1.1.9", "", null, "1.1.3"]);
    check("setProgDevices skips falsy", progStore.progDevices.size === 2 &&
      progStore.isProg("1.1.9") && progStore.isProg("1.1.3"));
    offProg();

    // --- report -----------------------------------------------------------
    const result = document.getElementById("result");
    const summary = `PASS ${pass} / FAIL ${fail}`;
    document.title = summary;
    result.textContent = summary;
    result.className = fail === 0 ? "pass" : "fail";
    if (failures.length) {
      const li = document.createElement("li");
      li.className = "bad";
      li.textContent = "FAILURES: " + failures.join("; ");
      details.appendChild(li);
    }
  </script>
</body>
</html>
