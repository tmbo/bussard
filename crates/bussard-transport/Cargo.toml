[package]
name = "bussard-transport"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "KNXnet/IP transport for bussard: Tunnel + Router behind one trait, cEMI codec"

[dependencies]
# Reuse the model's GroupAddress / IndividualAddress types.
bussard-model = { workspace = true }
# Async runtime + UDP sockets. From the workspace pin (MIT).
tokio = { workspace = true }
# Structured logging. From the workspace pin (MIT).
tracing = { workspace = true }
# Fine-grained socket control for multicast routing (join group, SO_REUSEADDR /
# SO_REUSEPORT, interface selection). MIT OR Apache-2.0. Pinned for rustc 1.82.
socket2 = { version = "0.5", features = ["all"] }
# Error enums. From the workspace pin (MIT).
thiserror = { workspace = true }
# Enumerate local network interfaces so discovery can search on each (multicast
# does not route, so we must send the SEARCH_REQUEST out of every interface).
# MIT OR Apache-2.0.
if-addrs = "0.15"

[dev-dependencies]
# `#[tokio::test]` for the async integration tests.
tokio = { workspace = true }
