[package]
name = "bussard-ets"
description = "Shared ETS-XML primitives: attributes, DPT/flag mapping, translations, containers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bussard-model = { path = "../bussard-model" }
thiserror = { workspace = true }
# Streaming XML: quick-xml never builds a DOM, so 20+ MB application-program
# files are read with bounded memory. MIT licensed.
quick-xml = "0.36"
# ZIP support for reading `.knxproj`/`.knxprod` container entries with a size
# cap. No AES here: encrypted `.knxproj` inner archives are handled by the
# `bussard-project` crate. MIT licensed.
zip = { version = "2.4", default-features = false, features = ["deflate"] }
