# cargo-nextest configuration.
#
# nextest runs each test in its own process, so tests are isolated from each
# other's environment and global state. That isolation is why the workspace's
# mock-gateway/device tests (which each bind their own 127.0.0.1:0 UDP socket)
# and any env-var-driven timing tests do not race under nextest even though they
# might when run in a single `cargo test` process.

[profile.default]
# Local default: fail fast so an iterating developer sees the first failure
# immediately instead of waiting out the whole suite.
fail-fast = true

# Never auto-retry locally: a flaky pass would hide a real problem while
# iterating. (CI retries a small number of times — see [profile.ci].)
retries = 0

# Surface slow tests without failing them. The real-import oracle tests
# (decrypt + ~15 MB XML) are legitimately the slowest at a few seconds even
# with the crypto/parser crates compiled optimized; warn well above that so the
# marker means "unexpectedly slow", not "known-slow oracle test".
slow-timeout = { period = "20s", terminate-after = 3 }

# Show the final per-test timing summary; makes regressions in individual tests
# visible in local runs.
status-level = "pass"
final-status-level = "slow"

[profile.ci]
# CI wants the full failure picture across every platform in one run, so do not
# stop at the first failure.
fail-fast = false

# Real-socket mock tests (UDP on 127.0.0.1) can occasionally lose a datagram or
# hit scheduler jitter on a loaded CI runner. Allow a couple of retries so a
# one-off timing blip does not red a whole run; a truly broken test still fails
# all attempts.
retries = 2

# On CI a hung test must not wedge the runner: kill anything that blows past the
# budget and report it as a failure.
slow-timeout = { period = "30s", terminate-after = 2 }

# GitHub runners have 3-4 cores, and the default is one thread per core. The
# slow tests wait on loopback sockets and timeouts, not CPU: at 4 threads the
# summed per-test time (613 s) is ~4x the wall time (154 s). Oversubscribe ~3x.
test-threads = 12

# Emit JUnit XML so CI can surface per-test results and timings.
[profile.ci.junit]
path = "junit.xml"

[profile.corpus]
# The corpus-gated tests (dev/testing.md): run with BUSSARD_PRODUCT_CORPUS
# set. A full-corpus sweep reads ~500 vendor archives and takes minutes, so the
# per-test budget is wide; everything else matches the CI profile.
fail-fast = false
retries = 0
slow-timeout = { period = "120s", terminate-after = 10 }

# The knx-sim flash-then-plan loop (scripts/sim-catalog-loop.sh, #346): one
# in-process shard flashes dozens of applications, each a minute or more on a
# loaded runner, so it gets an hour before nextest stops it.
[[profile.corpus.overrides]]
filter = 'test(/^sim_catalog_loop::/)'
slow-timeout = { period = "300s", terminate-after = 12 }

# The Dynamic round trip (issue #345) evaluates every program of the corpus
# 102 times (XML and model, defaults and 50 random value sets); the debug
# evaluator needs about 33 minutes for the ~500 archives (1354 programs).
[[profile.corpus.overrides]]
filter = 'test(/round_trips_the_dynamic_tree_on_the_corpus/)'
slow-timeout = { period = "300s", terminate-after = 12 }

# The view acceptance sweep (issue #345) builds the device view and the image
# of every program of the corpus under the defaults and 50 random value sets.
[[profile.corpus.overrides]]
filter = 'test(/view_shows_what_the_download_writes_on_the_corpus/)'
slow-timeout = { period = "300s", terminate-after = 12 }

# The synthetic product catalogue through the knx-sim flash-then-plan loop
# (epic #596): about 12 s per product locally, one product after another, and
# the catalogue grows to 40 (#604). 60 s killed it at five products. The
# synthetic oracle rows' `--check` (about 10 s per row) grows the same way.
[[profile.default.overrides]]
filter = 'test(/^sim_catalog_loop::test_sim_catalog_loop_synthetic_catalogue$/) | test(/^offline_oracle::test_offline_oracle_synthetic_rows_pass_the_check$/)'
slow-timeout = { period = "120s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'test(/^sim_catalog_loop::test_sim_catalog_loop_synthetic_catalogue$/) | test(/^offline_oracle::test_offline_oracle_synthetic_rows_pass_the_check$/)'
slow-timeout = { period = "120s", terminate-after = 10 }
