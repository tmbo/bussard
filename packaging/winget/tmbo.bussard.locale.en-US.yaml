ShortDescription: Program, monitor and decode a KNX building bus from the command line
Description: |-
  bussard is an open-source CLI for KNX building automation. It keeps the
  configuration of a KNX installation as YAML files in git, pushes changes to
  the devices over a KNXnet/IP gateway, watches and decodes bus traffic, and
  exposes an MCP server so an LLM can drive it. It imports ETS project exports
  and vendor product data, and every device write is plan-before-apply.
