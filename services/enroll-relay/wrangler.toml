# Cloudflare Worker for the bussard enrolment relay (#731) and the enrolment
# page (#797). The project's relay is served at bussard-relay.tmbo.dev
# (decided 2026-11-03, #731); a self-hosted copy replaces the route
# (README.md, "Deploy").
name = "bussard-enroll-relay"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "bussard-relay.tmbo.dev", custom_domain = true }]

# The enrolment page, web/enroll/ as it is in the repository (no build
# step), served by the Worker at /enroll/ with the page's security headers.
# The Worker runs first for every request, so no asset is ever served
# without those headers; it maps /enroll/<file> to <file> itself.
[assets]
directory = "../../web/enroll"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# The relay never logs bodies, and the request URLs carry session ids, so
# Workers Logs stay off.
[observability]
enabled = false

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "Session"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Session"]
