# An empty [workspace] table makes knx-sim its own workspace root, so it is
# fully standalone and cleanly extractable to its own repo. The bussard root
# Cargo.toml also lists it under `exclude`, but this table is what actually
# detaches it (bussard lives at a parent path).
[workspace]

[package]
name = "knx-sim"
version = "0.10.0"
edition = "2024"
rust-version = "1.88"
description = "An independent, strict KNX device + bus simulator for cross-checking flashing tools on the wire."
authors = ["Tom Bocklisch"]
repository = "https://github.com/tmbo/bussard"
license = "MIT"
# A test/development tool, never published to crates.io. Stated explicitly so an
# accidental `cargo publish` is refused, and so cargo-deny's `private = { ignore
# = true }` treats this crate's own licensing as out of scope (the gate exists to
# police THIRD-PARTY licenses).
publish = false

# Matches the bussard workspace posture: the CLAUDE.md rules ("all public items
# must have doc comments") are enforced here rather than left to CI's
# `-D warnings` alone, which adds nothing over warn-by-default.
[lints.rust]
missing_docs = "warn"

[dependencies]
# ZIP reader for the .knxprod container (a plain, unencrypted ZIP unlike the
# .knxproj). Version 9 or later: 2.x carries RUSTSEC-2026-0367/0368/0369.
# `deflate-flate2` keeps the pure-Rust miniz_oxide decoder zip 2 used. MIT.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# flate2: zip 9 takes flate2 with no backend selected, so this picks the
# pure-Rust miniz_oxide backend (the one zip 2 used). MIT OR Apache-2.0.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Streaming XML pull-parser for the product-data XML. MIT. 0.41 is the first
# release that caps namespace declarations per element (RUSTSEC advisory on
# `NamespaceResolver::push`); this crate uses the plain `Reader`, which the
# advisory does not affect, but the `cargo deny` gate rightly fails the older
# version.
quick-xml = "0.41"
# base64 decoder for the RelativeSegment <Data> application image. MIT/Apache-2.0.
base64 = "0.22"
# KNX Data Secure crypto, per dev/knx-secure-spec.md §3: AES-CCM is decomposed
# into AES-CBC-MAC (the tag) + AES-CTR (encrypt tag+payload), so NO `ccm` crate
# is needed. All three are RustCrypto cipher-0.4 generation, MIT/Apache-2.0.
# `aes` is the AES-128 block cipher; `cbc` supplies CBC mode for the CBC-MAC;
# `ctr` supplies CTR mode for the tag/payload keystream.
aes = "0.8"
cbc = "0.1"
ctr = "0.9"
# KNXnet/IP Secure server (issue #71 Phase B, spec §7-§9): X25519 ECDH
# (BSD-3-Clause; `static_secrets` builds the ephemeral secret from OS random
# bytes), SHA-256 for the session key and PBKDF2-HMAC-SHA256 for the password
# keys (both MIT OR Apache-2.0), OS randomness (MIT OR Apache-2.0).
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize", "precomputed-tables"] }
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
getrandom = "0.2"
# Config-file (de)serialization. MIT/Apache-2.0.
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
# Structured error types. MIT/Apache-2.0.
thiserror = "2"
# Structured logging of the observable event stream. MIT/Apache-2.0.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Binary entrypoint error plumbing. MIT/Apache-2.0.
anyhow = "1"

[lib]
name = "knx_sim"
path = "src/lib.rs"

[[bin]]
name = "knx-sim"
path = "src/main.rs"

# `serve` (src/bin/serve.rs) is an alias entrypoint used by the local flash
# loop (`serve <config>`); both binaries share the logic in `run`.
