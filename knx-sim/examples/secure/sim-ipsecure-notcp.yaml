# knx-sim installation for the refused-TCP case (bussard issues #197, #513):
# a secure-only interface WITHOUT a TCP endpoint. A unicast KNXnet/IP Secure
# session runs over TCP only (KNX IP Secure 3/8/9 §2.2.3.3), so bussard
# reports the refusal with its likely causes and opens nothing. run.sh drives
# it after the TCP cases.
#
# The credentials match the tunnelling interface in `synthetic.knxkeys`
# (interface host 1.1.0, tunnel 1.1.200, user 2). ALL of it is SYNTHETIC
# (spec §12.3).
gateway:
  host: "127.0.0.1"
  port: 13695
  secure:
    individual_address: "1.1.0"
    device_authentication_code: "device-auth-pw"
    secure_only: true
    # No TCP endpoint: a TCP connect is refused.
    tcp: false
    users:
      - id: 2
        password: "tunnel-user-pw"
        tunnel_address: "1.1.200"

devices:
  # A plain device behind the secure interface.
  - address: "1.1.3"
    knxprod: "../../tests/fixtures/KNX_Virtual_M-00FA.knxprod"
    application: "M-00FA_A-2500-10-51CB"
    initial_state: loaded
