# knx-sim installation for the KNX Data Secure (Phase A) cross-implementation
# conformance loop: bussard flashing a security-ACTIVATED device to a verified
# `Loaded` through A_SecureData (APCI 0x3F1) tool-access.
#
# run.sh (next to this file) starts the simulator on the port below, flashes
# 1.1.2 with the synthetic tool key in both CCM modes, and asserts the negatives.
#
# Three devices, same product (KNX Virtual DA.tp, mask 07B0):
#   1.1.2   security-ACTIVATED — every management APDU must ride A_SecureData
#   1.1.10  security-ACTIVATED, driven with the synthetic keyring (issue #156)
#   1.1.3   plain (no `security:` block) — the coexistence / regression peer
#
# All key material here is SYNTHETIC. No FDSK, tool key, group key or password
# derived from a real installation may ever be committed (spec §12.3).
gateway:
  host: "127.0.0.1"
  port: 13693

devices:
  # The conformance peer: security-activated, so a wrong MAC, a replayed
  # sequence and a plain (unwrapped) access to a protected function are all
  # refused exactly as a real activated device refuses them (spec §12.2).
  - address: "1.1.2"
    knxprod: "../../tests/fixtures/KNX_Virtual_M-00FA.knxprod"
    application: "M-00FA_A-2500-10-51CB"
    initial_state: unloaded
    security:
      # `activated` secures the device; omit the block (or use `plain`) to keep
      # the device plain (the default).
      status: activated
      # Synthetic 16-byte tool key (32 hex characters) — NOT a real key.
      tool_key: "0102030405060708090a0b0c0d0e0f10"
      # The device's own starting send sequence (ms since 2018-01-05, spec §5.8).
      initial_tx_seq: 200
      # The receive-freshness floor: a first inbound frame must strictly exceed
      # this, so a tool replaying an old sequence is rejected (spec §5.9).
      initial_rx_seq: 1000

  # The keyring peer (issue #156): security-activated with the tool key of
  # device 1.1.10 in `synthetic.knxkeys` (0x42 * 16, SYNTHETIC). run.sh flashes
  # and applies it with `--keyring`, so the download also programs its security
  # interface object (group key table from the keyring's key for 1/2/3,
  # group-object security flags).
  #
  # Secured group traffic (issue #172): once flashed, the device takes its group
  # keys from that security object (PID 53 row -> address-table index -> GA) and
  # its secured objects from the PID 61 flags. A secured GA then accepts only
  # A_SecureData (plain telegrams to it are ignored), a secured GroupValueRead is
  # answered with a secured GroupValueResponse, and the stimulus below sends
  # secured writes. Nothing here configures a group key.
  - address: "1.1.10"
    knxprod: "../../tests/fixtures/KNX_Virtual_M-00FA.knxprod"
    application: "M-00FA_A-2500-10-51CB"
    initial_state: unloaded
    security:
      status: activated
      tool_key: "42424242424242424242424242424242"
      initial_tx_seq: 300
      initial_rx_seq: 1000

  # The plain peer: a non-activated device on the same bus. It proves the mixed
  # installation of spec §6.4 (activation is per device) and that the plain flash
  # path is untouched by KNX Secure.
  - address: "1.1.3"
    knxprod: "../../tests/fixtures/KNX_Virtual_M-00FA.knxprod"
    application: "M-00FA_A-2500-10-51CB"
    initial_state: unloaded

# Secured group stimulus (issue #172): every 5 s, 1.1.10 re-transmits the
# CURRENT value of object 1 on its send GA (the first GA linked to it, 1/2/3 in
# run.sh) as a secured A_GroupValue_Write (SCF 0x10, group key of 1/2/3). No
# `values`, so the stimulus never changes the value: a secured write followed by
# a read stays deterministic, and the next stimulus carries the value last
# written. It only fires once object 1 has the Transmit flag (model flags CRWT)
# and a tunnel client is connected; the first fire is 2.5 s after start. Grep
# the sim log for `SECURE group send 1.1.10 -> 1/2/3` ... `inner=GroupValueWrite`.
stimulus:
  - device: "1.1.10"
    object: 1
    period_ms: 5000
