# knx-sim installation for the KNXnet/IP Secure (Phase B, issue #71) loop:
# a SECURE-ONLY tunnelling interface, like the Jung IP interface in bussard
# issue #90 S4. run.sh drives it after the Data Secure cases.
#
# The credentials match the tunnelling interface in `synthetic.knxkeys`
# (interface host 1.1.0, tunnel 1.1.200, user 2), so `--keyring` selects the
# user automatically. ALL of it is SYNTHETIC (spec §12.3).
gateway:
  host: "127.0.0.1"
  port: 13694
  secure:
    # The interface's own individual address (the keyring's `Host`).
    individual_address: "1.1.0"
    # SYNTHETIC device authentication code (the SESSION_RESPONSE MAC key is its
    # PBKDF2), as in synthetic.knxkeys.
    device_authentication_code: "device-auth-pw"
    # A plain UDP CONNECT is refused with 0x22 (bussard issue #182).
    secure_only: true
    users:
      - id: 2
        password: "tunnel-user-pw"
        tunnel_address: "1.1.200"

devices:
  # Data Secure inside IP Secure: the keyring's tool key (0x42 * 16).
  - address: "1.1.10"
    knxprod: "../../tests/fixtures/KNX_Virtual_M-00FA.knxprod"
    application: "M-00FA_A-2500-10-51CB"
    initial_state: unloaded
    security:
      status: activated
      tool_key: "42424242424242424242424242424242"
      initial_tx_seq: 300
      initial_rx_seq: 1000
  # A plain device behind the secure interface.
  - address: "1.1.3"
    knxprod: "../../tests/fixtures/KNX_Virtual_M-00FA.knxprod"
    application: "M-00FA_A-2500-10-51CB"
    initial_state: loaded
