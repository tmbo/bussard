# knx-sim installation for the secure idle probe (bussard issue #197): a
# secure-only interface whose idle sessions end after 4 s with a wrapped
# STATUS_TIMEOUT. run.sh drives `bussard test --secure-idle` against it.
#
# The credentials match the tunnelling interface in `synthetic.knxkeys`
# (interface host 1.1.0, tunnel 1.1.200, user 2). ALL of it is SYNTHETIC
# (spec §12.3).
gateway:
  host: "127.0.0.1"
  port: 13696
  secure:
    individual_address: "1.1.0"
    device_authentication_code: "device-auth-pw"
    secure_only: true
    # An idle session ends after 4 s with a wrapped STATUS_TIMEOUT, so
    # `bussard test --secure-idle` has something to measure.
    session_timeout_ms: 4000
    users:
      - id: 2
        password: "tunnel-user-pw"
        tunnel_address: "1.1.200"

devices:
  # A plain device behind the secure interface.
  - address: "1.1.3"
    knxprod: "../../tests/fixtures/KNX_Virtual_M-00FA.knxprod"
    application: "M-00FA_A-2500-10-51CB"
    initial_state: loaded
