# Example knx-sim installation: one bus, one strict System-B device.
#
# Run:  knx-sim examples/da_tp.yaml
# then point a KNXnet/IP tool (e.g. a flasher) at 127.0.0.1:3671.
#
# The device is the KNX-Virtual DA.tp "Aktor zum Dimmen" (mask MV-07B0, System
# B). Starting it `unloaded` mimics a fresh device; `loaded` mimics one that was
# already programmed. Every telegram and state change is logged to stdout — the
# same event stream a future read-only HTML visualization will consume.

gateway:
  host: "127.0.0.1"
  port: 3671

devices:
  - address: "1.1.2"
    # Path is resolved relative to this config file's directory.
    knxprod: "../tests/fixtures/KNX_Virtual_M-00FA.knxprod"
    application: "M-00FA_A-2500-10-51CB"
    initial_state: unloaded
