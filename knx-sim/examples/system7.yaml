# knx-sim installation with a System 7 (mask 0705) device behind a KNXnet/IP
# tunnelling gateway on loopback. This is the conformance peer for bussard's
# System 7 download path.
#
# Run:   knx-sim knx-sim/examples/system7.yaml
# then drive a KNXnet/IP tool (e.g. `bussard flash`) at 127.0.0.1:13671.
#
# The MDT `M-0083_A-000E` (AKK-01UP.03, Switching 1-fold) is the smallest
# canonical 0705 product and the first System 7 conformance target. Vendor
# `.knxprod` files are copyrighted and git-ignored (see the `products/`
# .gitignore in the small-installation example), so place the product yourself
# at the path below — the corpus filename is `MDT_KP_AKK_...` or fetch it from
# the product corpus.
gateway:
  host: "127.0.0.1"
  port: 13671

devices:
  # A System 7 switch actuator. The mask (0705) comes from the product's
  # MaskVersion, selecting the System 7 device model automatically. The two
  # System-7-only knobs below are optional and shown at their defaults:
  #
  #   lsm_access: memory   # how the three parallel load-state machines are
  #                        # realised on the wire. `memory` (the default) is the
  #                        # memory-mapped 12-octet record at the LSM control
  #                        # address with the status polled back; `property`
  #                        # drives them over PID_LOAD_STATE_CONTROL (PID 5).
  #                        # A tool can be conformance-tested against either.
  #
  #   bcu_key: "0xFFFFFFFF" # the BCU key required for memory access. Omit for
  #                        # free access (the default): any key unlocks. Set it
  #                        # to require a matching A_Authorize before any write.
  - address: "1.1.5"
    knxprod: "small-installation/products/MDT_KP_AKK_03_Switch_Actuator_V23.knxprod"
    application: "M-0083_A-000E-23-2274"
    initial_state: unloaded
    lsm_access: memory

  # The same product presented with the property-based LSM realisation, so a
  # tool's realisation switch can be exercised against both device sides on one
  # bus. (A real device is one or the other; this is a test convenience.)
  - address: "1.1.6"
    knxprod: "small-installation/products/MDT_KP_AKK_03_Switch_Actuator_V23.knxprod"
    application: "M-0083_A-000E-23-2274"
    initial_state: unloaded
    lsm_access: property
