# Group-address plan for the small-installation example.
#
# A handful of GAs wiring four simulated devices: two switch actuators (kitchen +
# hallway lights), one dimming actuator (living-room light) and one heating
# actuator (a room temperature the valve tracks). Each switched load has a command
# GA and a status GA; the status objects carry the Read flag, so `bussard read`
# gets a served answer, and the simulator scripts stimulus onto them so
# `bussard monitor` sees a live bus.
project: small-installation
ranges:
  '1':
    name: Lighting
  '2':
    name: Dimming
  '3':
    name: Heating
groups:
  # --- Lighting (switch actuators) ---
  1/0/1:
    name: Light Kitchen
    dpt: '1.001'
  1/0/2:
    name: Light Kitchen Status
    dpt: '1.001'
  1/1/1:
    name: Light Hallway
    dpt: '1.001'
  1/1/2:
    name: Light Hallway Status
    dpt: '1.001'
  # --- Dimming (DA.tp dimming actuator) ---
  2/0/1:
    name: Dimmer Living Control
    dpt: '3.007'
  2/0/2:
    name: Dimmer Living Value
    dpt: '5.001'
  # --- Heating (heating actuator) ---
  3/0/1:
    name: Room Temperature Living
    dpt: '9.001'
