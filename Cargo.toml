[workspace]
resolver = "2"
# knx-sim is a standalone, independently-developed KNX device+bus simulator used
# to cross-check bussard on the wire. It shares NO code with bussard and is a
# separate Cargo project, so it is excluded from this workspace.
exclude = ["knx-sim"]
members = [
    "crates/bussard-model",
    "crates/bussard-project",
    "crates/bussard-transport",
    "crates/bussard-monitor",
    "crates/bussard-mcp",
    "crates/bussard-ha",
    "crates/bussard-mgmt",
    "crates/bussard-prod",
    "crates/bussard-ets",
    "crates/bussard-bus",
    "crates/bussard-download",
    "crates/bussard-secure",
    "crates/bussard-service",
    "crates/bussard-viz",
    "crates/bussard-cli",
    "crates/bussard-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/tmbo/bussard"
authors = ["Tom Bocklisch"]
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
# Internal crates
bussard-model = { path = "crates/bussard-model", version = "0.1.0" }
bussard-project = { path = "crates/bussard-project", version = "0.1.0" }
bussard-transport = { path = "crates/bussard-transport", version = "0.1.0" }
bussard-monitor = { path = "crates/bussard-monitor", version = "0.1.0" }
bussard-bus = { path = "crates/bussard-bus", version = "0.1.0" }
bussard-mcp = { path = "crates/bussard-mcp", version = "0.1.0" }
bussard-mgmt = { path = "crates/bussard-mgmt", version = "0.1.0" }
bussard-prod = { path = "crates/bussard-prod", version = "0.1.0" }
bussard-ets = { path = "crates/bussard-ets", version = "0.1.0" }
bussard-ha = { path = "crates/bussard-ha", version = "0.1.0" }
bussard-download = { path = "crates/bussard-download", version = "0.1.0" }
bussard-secure = { path = "crates/bussard-secure", version = "0.1.0" }
bussard-service = { path = "crates/bussard-service", version = "0.1.0" }
bussard-viz = { path = "crates/bussard-viz", version = "0.1.0" }
# Test-only mock gateway and devices (publish = false): dev-dependency only.
bussard-testkit = { path = "crates/bussard-testkit" }

# Third-party (all MIT and/or Apache-2.0)
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML: serde_norway is the maintained fork of serde_yaml by the YAML/Norway
# org (MIT OR Apache-2.0). The model itself is TOML; YAML remains only for the
# Home Assistant output (`bussard-ha`) and the local `models/*.yaml` product
# cache (`bussard-model::param_model`, `bussard-cli import-product`).
serde_norway = "0.9"
serde_path_to_error = "0.1"
# TOML: the model files (`bussard.toml`, `groups.toml`, `devices/*.toml`,
# `bussard.lock`, `tests.toml`, `ha.toml`). `toml` parses into the typed
# schema with spans for error carets; `toml_edit` writes, keeping comments and
# untouched lines byte-identical. Both MIT OR Apache-2.0.
toml = "1"
toml_edit = "0.25"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bitflags = "2"
owo-colors = "4"
# indicatif: the live TTY progress display for flash/apply/scan (issue #147).
# MIT; its tree (console, portable-atomic, unit-prefix, unicode-width) is
# MIT/Apache-2.0.
indicatif = "0.18"
# base64: decodes ETS code-segment <Data>/<Mask> payloads (the application
# binary image) into bytes. All MIT/Apache-2.0.
base64 = "0.22"
# rayon: data-parallel iterators. Used to parse the distinct referenced
# ApplicationProgram XML files in parallel during `.knxproj` import (the parse
# dominates import wall time). MIT OR Apache-2.0.
rayon = "1"
# axum: the HTTP framework for the `bussard viz` web server (routes, extractors,
# SSE, static-asset responses). MIT. Its tree (hyper, tower, http) is already
# vetted by deny.toml's MIT/Apache allow-list.
axum = "0.8"
# tokio-stream: adapts the `TrafficHub`'s tokio broadcast receiver into a
# `Stream` for axum's SSE responder (the `sync` feature wraps broadcast/watch).
# MIT.
tokio-stream = { version = "0.1", features = ["sync"] }
# zip: reads `.knxprod`/`.knxproj` container entries (deflate only, no AES here —
# encrypted `.knxproj` inner archives are handled inside bussard-project). Shared
# by bussard-ets and bussard-prod. MIT licensed.
zip = { version = "2.4", default-features = false, features = ["deflate"] }
# quick-xml: streaming XML (never builds a DOM) so 20+ MB application-program
# files parse with bounded memory. MIT licensed.
quick-xml = "0.41"
# --- KNX Secure crypto (issue #71, Phase A) ---
# aes: AES-128 block cipher, the core of KNX Secure's decomposed AES-CCM
# (AES-CBC-MAC + AES-CTR, spec §3). Promoted from a transitive dep (via `zip`)
# to a direct workspace dep. MIT OR Apache-2.0.
aes = "0.8"
# cbc: CBC block mode, used to build the KNX Secure CBC-MAC (the CCM tag,
# spec §3.2). cipher-0.4 generation to match `aes 0.8` (0.2 is cipher-0.5 and
# must NOT be mixed). MIT OR Apache-2.0.
cbc = "0.1"
# ctr: CTR stream mode, used to encrypt the CCM tag and payload (spec §3.3).
# cipher-0.4 generation to match `aes 0.8` (0.10 is cipher-0.5). MIT OR
# Apache-2.0.
ctr = "0.9"
# pbkdf2: PBKDF2-HMAC-SHA256 key derivation for the keyring/IP-handshake key
# schedule (spec §3.4). Already used by bussard-project for the ETS6 zip
# password; promoted to a workspace dep so bussard-secure shares it. MIT OR
# Apache-2.0.
pbkdf2 = "0.12"
# sha2 / hmac: SHA-256 and HMAC-SHA256 primitives underpinning PBKDF2 and the
# keyring IV/signature (spec §4). MIT OR Apache-2.0.
sha2 = "0.10"
hmac = "0.12"
# zeroize: zeroizes raw 16-byte key buffers on drop so key material does not
# linger in freed memory (spec §2.3). The `derive` feature provides the
# `Zeroize`/`ZeroizeOnDrop` derive macros. MIT OR Apache-2.0.
zeroize = { version = "1", features = ["derive"] }
# --- KNXnet/IP Secure (issue #71, Phase B) ---
# x25519-dalek: X25519 ECDH for the SESSION_REQUEST/RESPONSE key agreement
# (spec §7.2). BSD-3-Clause (on the deny.toml allow-list). `static_secrets`
# lets the ephemeral secret be built from OS random bytes (no rand_core RNG
# plumbing); the secret zeroizes on drop.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize", "precomputed-tables"] }
# getrandom: OS randomness for the ephemeral X25519 key and the client serial.
# Already in the tree transitively. MIT OR Apache-2.0.
getrandom = "0.2"

# ---------------------------------------------------------------------------
# Local builds: line tables instead of full DWARF. The workspace links ~67
# test binaries plus the `bussard` binary, and full debuginfo made those links
# I/O bound (a 583 s all-targets build for 125 s of CPU) and grew target/ to
# ~80 GB. Line tables keep panic locations and readable backtraces. CI sets
# CARGO_PROFILE_DEV_DEBUG=0 in the environment, which overrides this.
# Workspace lints. A crate opts in with `[lints] workspace = true`.
# `unwrap_used` enforces the CLAUDE.md rule "never `.unwrap()` in tests" (and in
# library code, which is already clean). Cargo cannot scope a lint to test
# targets, but library code has no unwraps, so in practice it bites on tests.
# `expect_used` is NOT listed: CLAUDE.md allows `.expect()` in tests and in a
# binary's `main()`. Crates whose tests still unwrap have not opted in yet
# (issue #87 tracks them); opting in with the lint at `warn` would fail
# `cargo clippy -- -D warnings`.
[workspace.lints.clippy]
unwrap_used = "deny"

[profile.dev]
debug = "line-tables-only"

# Build profiles tuned for test iteration speed.
#
# The `.knxproj` import path runs PBKDF2-HMAC-SHA256 for 65_536 iterations to
# derive the ZIP password. At the default test/dev opt-level of 0 the crypto is
# unoptimized and dominates the oracle-import tests (and the pure
# `derive_zip_password` unit test). Compiling ONLY the crypto crates with
# optimizations keeps the rest of the workspace at opt-level 0 (fast to compile,
# fast to iterate) while making the hot inner loops orders of magnitude faster
# to run. These deps are third-party and rarely rebuilt, so the one-time
# optimized compile is amortized across every subsequent test run.
[profile.test.package.pbkdf2]
opt-level = 3
[profile.test.package.sha2]
opt-level = 3
[profile.test.package.hmac]
opt-level = 3
[profile.test.package.digest]
opt-level = 3
# The AES-encrypted inner ZIP is decrypted on every real-import test; optimize
# the cipher and ZIP crates for the same reason.
[profile.test.package.aes]
opt-level = 3
[profile.test.package.zip]
opt-level = 3
# The real-import oracle tests also inflate ~15 MB of DEFLATE and stream that
# XML through quick-xml. These crates are the inner loop of that ~14 s import,
# so optimizing them shrinks the slowest test in the suite.
[profile.test.package.quick-xml]
opt-level = 3
[profile.test.package.flate2]
opt-level = 3
[profile.test.package.miniz_oxide]
opt-level = 3
[profile.test.package.crc32fast]
opt-level = 3
# KNX Secure (Data Secure CCM from aes + cbc + ctr, the KNXnet/IP Secure
# X25519 handshake): every secured frame and tunnel start runs through these.
[profile.test.package.cipher]
opt-level = 3
[profile.test.package.cbc]
opt-level = 3
[profile.test.package.ctr]
opt-level = 3
[profile.test.package.x25519-dalek]
opt-level = 3
[profile.test.package.curve25519-dalek]
opt-level = 3

# `cargo test --doc` and any `cargo run` in tests use the `dev` profile, and the
# CLI integration tests spawn the built `bussard` binary — which itself imports
# the project. Mirror the crypto optimization there so those paths are fast too.
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.zip]
opt-level = 3
# The rest of the crypto and archive stack the `bussard` binary runs on every
# secured command, `keyring` read and import (issue #194): the Data Secure CCM
# (aes + cbc + ctr), the KNXnet/IP Secure X25519 handshake, and the
# `.knxproj`/`.knxprod` inflate and XML parse. Third-party and rarely rebuilt.
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.cbc]
opt-level = 3
[profile.dev.package.ctr]
opt-level = 3
[profile.dev.package.crypto-common]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.subtle]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.x25519-dalek]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.quick-xml]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
