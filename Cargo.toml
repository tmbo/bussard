[workspace]
resolver = "2"
members = [
    "crates/bussard-model",
    "crates/bussard-project",
    "crates/bussard-transport",
    "crates/bussard-monitor",
    "crates/bussard-mcp",
    "crates/bussard-ha",
    "crates/bussard-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tmbo/bussard"
authors = ["Tom Bocklisch"]
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
bussard-model = { path = "crates/bussard-model", version = "0.1.0" }
bussard-project = { path = "crates/bussard-project", version = "0.1.0" }
bussard-transport = { path = "crates/bussard-transport", version = "0.1.0" }
bussard-monitor = { path = "crates/bussard-monitor", version = "0.1.0" }
bussard-mcp = { path = "crates/bussard-mcp", version = "0.1.0" }

# Third-party (all MIT and/or Apache-2.0)
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML: serde_norway is the maintained fork of serde_yaml by the YAML/Norway
# org (MIT OR Apache-2.0). It rejects duplicate map keys and unknown fields.
# All YAML (de)serialization is isolated inside bussard-model so this choice
# is swappable.
serde_norway = "0.9"
serde_path_to_error = "0.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bitflags = "2"
owo-colors = "4"
