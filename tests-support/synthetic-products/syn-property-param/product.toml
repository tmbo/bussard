# A synthetic product of the catalogue (#604 row 30), syn-minimal plus one
# construct. Rendered by ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-minimal with a third parameter, an 8-bit number (default 90, `5A`),
reached in the parameter block and placed by `<Property ObjectIndex="4"
PropertyId="201">` instead of a `<Memory>`, and an `LdCtrlWriteProp
ObjIdx="4" PropId="201"` without `InlineData` in the application's MergeId 4
block, after the segment write, which writes the value the parameter
composes. PID 201 is a manufacturer property of the application object that
only this product's procedure names (knx-sim seeds it writable from the
procedure). Regression row for property placement: the capture shows the
property write ETS makes from the parameter. ETS 6.4.1 wrote `5A` to obj 4
PID 201; bussard wrote nothing there on System B until #669, which also made
the oracle headline count a property-write difference."""
construct = "parameter placed in a property, written by LdCtrlWriteProp"
issues = [669]

[product]
text = "Territory marker"
order_number = "NEST-TERR"
hardware_name = "NEST-TERR"
hardware_serial = "00FA0027001E"
bus_current = 10

[application]
number = 0x271E
version = 0x10
name = "Territory marker"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Reviermarkierer" }

[application.options]
Comparable = true
Reconstructable = true

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter_type]]
name = "Mark"
kind = "number"
size_bits = 8
signed = false
min = 0
max = 255

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

# The construct: a parameter placed in object 4's PID 201, written by the
# LdCtrlWriteProp below.
[[parameter]]
name = "territory"
type = "Mark"
text = "Territory mark"
default = 90
property = { object_index = 4, property_id = 201, offset = 0, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay", "territory"]
com_objects = [0, 1]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment, MergeId 4 writes it and the property PID 201.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 0 }]

[[load_procedure]]
merge_id = 4
ops = [
    { op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false },
    { op = "LdCtrlWriteProp", object = 4, prop_id = 201, start_element = 1, count = 1, verify = false },
]
