# A synthetic product of the catalogue (#604 row 6), syn-minimal plus one
# construct. Rendered by ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-minimal with a 14-octet TypeText parameter, reached at its default
"Störung", and no `TextParameterEncoding` in the application's Options.
Issue #416: without a declared code page bussard takes ASCII only and refuses
the non-ASCII default at plan time; the octets ETS writes for "ö" decide
between Latin-1 (`F6`), UTF-8 (`C3 B6`) and another code page."""
construct = "TypeText non-ASCII default, no TextParameterEncoding"
issues = [416]

[product]
text = "Squawk display"
order_number = "NEST-SQUAWK"
hardware_name = "NEST-SQUAWK"
hardware_serial = "00FA00270006"
bus_current = 10

[application]
number = 0x2706
version = 0x10
name = "Squawk display"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Krächzanzeige" }

[application.options]
Comparable = true
Reconstructable = true

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter_type]]
name = "Message"
kind = "text"
size_octets = 14

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

# The construct: a text parameter whose default is not ASCII, in a program
# that declares no TextParameterEncoding.
[[parameter]]
name = "alarm_text"
type = "Message"
text = "Alarm text"
default = "Störung"
memory = { segment = "main", offset = 3, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay", "alarm_text"]
com_objects = [0, 1]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment, MergeId 4 writes it.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 0 }]

[[load_procedure]]
merge_id = 4
ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false }]
