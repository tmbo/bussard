# A synthetic product of the catalogue (#604 row 14), syn-minimal plus one
# construct. Rendered by ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-minimal with a <choose> in the Dynamic tree on a steering parameter that
has no memory and that no block shows (a virtual 8-bit enum, default 0,
default access), whose only branch is <when default="true">. The branch shows
a block with a 16-bit parameter at +3 (default 0x1234, template FF FF) and
com object 2. Issue #474: on 15 Zennio Flat applications ETS took no branch of
such a choose, while bussard treats a never-shown memoryless parameter as
active and takes the default branch (the shortcut #563 keeps for the ABB
System 7 programs). On System B ETS writes a hidden parameter at its default
anyway (syn-hidden-default), so the object table decides: object 2's
descriptor is written when ETS takes the branch and left 00 00 when it does
not. Unlike the Flat parameter this one is not Access="Read", which #474
names as the capture that separates its two candidate rules."""
construct = "choose on a never-shown memoryless parameter, default branch only"
issues = [474, 563]

[product]
text = "Ghost-mouse detector"
order_number = "NEST-GHOST"
hardware_name = "NEST-GHOST"
hardware_serial = "00FA0027000E"
bus_current = 10

[application]
number = 0x270E
version = 0x10
name = "Ghost-mouse detector"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Geistermausmelder" }

[application.options]
Comparable = true
Reconstructable = true

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

# The construct, part 1: a steering parameter with no memory that no block
# shows, and a placed parameter its default branch shows (default unlike FF FF).
[[parameter]]
name = "ghost_seen"
type = "Mode"
text = "Ghost seen"
default = 0
virtual = true

[[parameter]]
name = "ghost_sensitivity"
type = "Delay"
text = "Ghost sensitivity"
default = 4660
memory = { segment = "main", offset = 3, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[com_object]]
number = 2
name = "ghost"
text = "Ghost mouse"
function_text = "Ghost alarm"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay"]
com_objects = [0, 1]

# The construct, part 2: a <choose> on the never-shown steering parameter with
# only a default branch, which shows the ghost block (a parameter and object 2).
[[dynamic.choose]]
parameter = "ghost_seen"

[[dynamic.choose.when]]
default = true

[[dynamic.choose.when.block]]
name = "ghost"
text = "Ghost mouse"
parameters = ["ghost_sensitivity"]
com_objects = [2]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment, MergeId 4 writes it.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 0 }]

[[load_procedure]]
merge_id = 4
ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false }]
