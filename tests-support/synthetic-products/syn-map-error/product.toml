# A synthetic product of the catalogue (#604 row 38), syn-product-07b0 plus one
# construct. Rendered by ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-product-07b0 (07B0, ProductProcedure, the tables as relative segments)
with an LdCtrlUnload of LSM 5 ahead of the other unloads, wrapped in
LdCtrlMapError: OriginalError 0xC0042B08 (3221498632) mapped to 0 before it and
back to itself after it, as the 27 Siemens 07B0 applications of #614 carry it
(e.g. M-0001_A-9A13-01-A8DA): the unload of an object the device may not have
is no error. bussard refused the op as Raw until #648 typed it; it now sends
the unload to object 5 and takes the device's refusal of an absent object as
success. The capture shows what ETS sends for the mapped unload and how the
device's answer is taken."""
construct = "LdCtrlMapError around LdCtrlUnload LsmIdx 5 (07B0 ProductProcedure)"
issues = [614]

[product]
text = "False-alarm filter"
order_number = "NEST-FALSE"
hardware_name = "NEST-FALSE"
hardware_serial = "00FA00270026"
bus_current = 10

[application]
number = 0x2726
version = 0x10
name = "False-alarm filter"
mask = "07B0"
load_procedure_style = "ProductProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Fehlalarmfilter" }

[application.options]
Comparable = true
Reconstructable = true

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay"]
com_objects = [0, 1]

# The construct (#614): the whole download as one product procedure, the
# Siemens 07B0 shape. The program version is manufacturer 00FA, application
# 2726, version 10.
[[load_procedure]]
ops = [
    { op = "LdCtrlConnect" },
    # The construct (#614): the unload of LSM 5, whose "object absent" error
    # (0xC0042B08) ETS is told to take as success, then the rule ends.
    { op = "LdCtrlMapError", original_error = 3221498632, mapped_error = 0 },
    { op = "LdCtrlUnload", lsm = 5 },
    { op = "LdCtrlMapError", original_error = 3221498632, mapped_error = 3221498632 },
    { op = "LdCtrlUnload", lsm = 4 },
    { op = "LdCtrlUnload", lsm = 3 },
    { op = "LdCtrlUnload", lsm = 2 },
    { op = "LdCtrlUnload", lsm = 1 },
    { op = "LdCtrlLoad", lsm = 4 },
    { op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 0 },
    { op = "LdCtrlLoad", lsm = 3 },
    { op = "LdCtrlRelSegment", lsm = 3, size = 6, mode = 0, fill = 0 },
    { op = "LdCtrlLoad", lsm = 1 },
    { op = "LdCtrlRelSegment", lsm = 1, size = 130, mode = 0, fill = 0 },
    { op = "LdCtrlLoad", lsm = 2 },
    { op = "LdCtrlRelSegment", lsm = 2, size = 130, mode = 0, fill = 0 },
    { op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false },
    { op = "LdCtrlWriteRelMem", object = 3, offset = 0, size = 6, verify = false },
    { op = "LdCtrlWriteRelMem", object = 2, offset = 0, size = 130, verify = false },
    { op = "LdCtrlWriteRelMem", object = 1, offset = 0, size = 130, verify = false },
    { op = "LdCtrlWriteProp", object = 4, prop_id = 13, verify = true, inline_data = "00FA272610" },
    { op = "LdCtrlLoadCompleted", lsm = 3 },
    { op = "LdCtrlLoadCompleted", lsm = 2 },
    { op = "LdCtrlLoadCompleted", lsm = 1 },
    { op = "LdCtrlLoadCompleted", lsm = 4 },
    { op = "LdCtrlDisconnect" },
]
