# The smallest BCU 2 download (mask 0021, #525) in the shape the corpus BCU 2
# programs share. Rendered by ../generate.py into xml/; see ../README.md for
# the schema.

[doc]
purpose = """
The first ETS capture of a BCU 2 memory download. 63 corpus programs on mask
0021 (and 24 on 0025, 3 on 0020) allocate absolute segments through PID 5 of
objects 1 to 3 (KNX 6 Profiles Annex A.2.4.1 Table 7) and no capture shows
the octets ETS sends: the Segment Control Record of each LSM, the task records
of LSM 3, which octets of a segment ETS writes and in what order. The layout
follows KNX 9/4/1 section 5.1.2.12: the address table at 0116h, the
association table after it, the group object table and the parameters in user
EEPROM, the RAM flags and values in page 0 RAM (00BDh to 00DFh)."""
construct = "BCU 2 download: AbsSegment, Segment Control Record and task records over PID 5 (0021)"
issues = [525]

[product]
text = "Wren switch"
order_number = "NEST-WREN"
hardware_name = "NEST-WREN"
hardware_serial = "00FA00280080"
bus_current = 10

[application]
number = 0x2880
version = 0x10
name = "Wren switch"
mask = "0021"
load_procedure_style = "ProductProcedure"
pei_type = 0
address_table_max_entries = 15
association_table_max_entries = 15
address_table_segment = "address-table"
association_table_segment = "association-table"
com_object_table_segment = "application"

[application.options]
Comparable = true
Reconstructable = true

# LSM 1: the address table, Realisation Type 2 at 0116h (KNX 3/5/1 4.16.4):
# length, own address, 15 group addresses.
[[segment]]
name = "address-table"
kind = "absolute"
address = 0x0116
size = 0x20
memory_type = "EEPROM"
allocate_only = true

# LSM 2: the association table right after it.
[[segment]]
name = "association-table"
kind = "absolute"
address = 0x0136
size = 0x20
memory_type = "EEPROM"
allocate_only = true

# LSM 3: the RAM flags and values of the com objects in page 0 RAM.
[[segment]]
name = "ram"
kind = "absolute"
address = 0x00C8
size = 0x18
memory_type = "RAM"
allocate_only = true

# LSM 3: the group object table, Realisation Type 2 (3/5/1 4.18.4): count 2,
# RAM flags at 00C8h, then per object [value ptr][CONFIG][TYPE]: switch at
# 00CAh C W low (17h), status at 00CBh C R T low (4Fh), both 1 bit.
[[segment]]
name = "application"
kind = "absolute"
address = 0x0156
size = 0x20
memory_type = "EEPROM"
data = "02c8ca1700cb4f00"
fill = 0xFF

# LSM 3: the parameter image.
[[segment]]
name = "parameters"
kind = "absolute"
address = 0x0176
size = 0x10
memory_type = "EEPROM"
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
]

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "parameters", offset = 0, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode"]
com_objects = [0, 1]

# The corpus shape (43 programs, e.g. M-0001_A-9083-01-7D38): the three LSMs
# torn down, each loaded with its segments and its Segment Control Record,
# LSM 3 with the Task Pointer and Task Control Records. Access 32h (read 3,
# write 2), EEPROM (3) with checksum control (80h) for the tables, RAM type 1
# (page 0) for the flags and values.
[[load_procedure]]
ops = [
    { op = "LdCtrlConnect" },
    { op = "LdCtrlUnload", lsm = 1 },
    { op = "LdCtrlUnload", lsm = 2 },
    { op = "LdCtrlUnload", lsm = 3 },
    { op = "LdCtrlLoad", lsm = 1 },
    { op = "LdCtrlAbsSegment", lsm = 1, seg_type = 0, address = 0x0116, size = 0x20, access = 0x32, mem_type = 3, seg_flags = 0x80 },
    { op = "LdCtrlTaskSegment", lsm = 1, address = 0x0116 },
    { op = "LdCtrlLoadCompleted", lsm = 1 },
    { op = "LdCtrlLoad", lsm = 2 },
    { op = "LdCtrlAbsSegment", lsm = 2, seg_type = 0, address = 0x0136, size = 0x20, access = 0x32, mem_type = 3, seg_flags = 0x80 },
    { op = "LdCtrlTaskSegment", lsm = 2, address = 0x0136 },
    { op = "LdCtrlLoadCompleted", lsm = 2 },
    { op = "LdCtrlLoad", lsm = 3 },
    { op = "LdCtrlAbsSegment", lsm = 3, seg_type = 0, address = 0x00C8, size = 0x18, access = 0x32, mem_type = 1, seg_flags = 0 },
    { op = "LdCtrlAbsSegment", lsm = 3, seg_type = 0, address = 0x0156, size = 0x20, access = 0x32, mem_type = 3, seg_flags = 0x80 },
    { op = "LdCtrlAbsSegment", lsm = 3, seg_type = 0, address = 0x0176, size = 0x10, access = 0x32, mem_type = 3, seg_flags = 0x80 },
    { op = "LdCtrlTaskSegment", lsm = 3, address = 0x0156 },
    { op = "LdCtrlTaskPtr", lsm = 3, init_ptr = 0, save_ptr = 0, serial_ptr = 0 },
    { op = "LdCtrlTaskCtrl1", lsm = 3, address = 0, count = 0 },
    { op = "LdCtrlTaskCtrl2", lsm = 3, callback = 0, address = 0x0156, seg0 = 0x00C8, seg1 = 0x00C8 },
    { op = "LdCtrlLoadCompleted", lsm = 3 },
    { op = "LdCtrlDisconnect" },
]
