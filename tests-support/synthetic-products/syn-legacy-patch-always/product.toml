# A synthetic product of the catalogue (#604 row 20), syn-minimal plus one
# construct. Rendered by ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-minimal with a third parameter, a 16-bit number at +3 that no parameter
block references (so ETS never shows it), carrying `LegacyPatchAlways="true"`,
whose default 0x1234 differs from the segment template (`FF FF`), in an
application that declares `DownloadInvisibleParameters="Background"`, so an
ordinary hidden parameter keeps the template. Regression row for #450 (closed):
ETS writes such a parameter at its default whether or not it is shown, and
bussard gives it a slot since; the capture shows `12 34` at +3. Unlike
syn-param-calculation, no calculation feeds the parameter."""
construct = "hidden LegacyPatchAlways parameter, default differs from template"
issues = [450]

[product]
text = "Twig patcher"
order_number = "NEST-PATCH"
hardware_name = "NEST-PATCH"
hardware_serial = "00FA00270014"
bus_current = 10

[application]
number = 0x2714
version = 0x10
name = "Twig patcher"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Zweigflicker" }

[application.options]
Comparable = true
Reconstructable = true
# Hidden parameters keep the template, so only LegacyPatchAlways writes one (#450).
DownloadInvisibleParameters = "Background"

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

# The construct: a parameter in no block, LegacyPatchAlways, whose default
# 0x1234 differs from the template FF FF.
[[parameter]]
name = "patch"
type = "Delay"
text = "Patch value"
default = 4660
legacy_patch_always = true
memory = { segment = "main", offset = 3, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay"]
com_objects = [0, 1]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment, MergeId 4 writes it.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 0 }]

[[load_procedure]]
merge_id = 4
ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false }]
