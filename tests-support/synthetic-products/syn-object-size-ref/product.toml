# A synthetic product of the catalogue (#1065), syn-minimal plus one
# construct. Rendered by ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-minimal with a third com object whose ComObject declares
`ObjectSize="LegacyVarData"`, a size without a value field type code
(Resources Table 88), while its only ComObjectRef states `14 Bytes`. The ref's
size overrides the object's, so the descriptor takes code 14; bussard refused
the program before #1065 (the Jung `A-1111-11-A356` object 7 shape)."""
construct = "ComObject size LegacyVarData, its ref 14 Bytes"
issues = [1065, 545]

[product]
text = "Nest message board"
order_number = "NEST-NOTE"
hardware_name = "NEST-NOTE"
hardware_serial = "00FA00270029"
bus_current = 10

[application]
number = 0x2729
version = 0x10
name = "Nest message board"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Nestanzeigetafel" }

[application.options]
Comparable = true
Reconstructable = true

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

# The construct: the object's own size has no type code, its ref's has.
[[com_object]]
number = 2
name = "message"
text = "Message"
function_text = "Display text"
size = "LegacyVarData"
ref_size = "14 Bytes"
dpt = "DPST-16-0"
flags = ["C", "W"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay"]
com_objects = [0, 1, 2]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment, MergeId 4 writes it.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 0 }]

[[load_procedure]]
merge_id = 4
ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false }]
