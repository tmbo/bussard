# A synthetic product of the catalogue (#1065), syn-text-undeclared with
# another default. Rendered by ../generate.py into xml/; see ../README.md.

[doc]
purpose = """
syn-text-undeclared with the 14-octet text default "Temp ℃": no
TextParameterEncoding, and `℃` (U+2103) has no octet in ISO 8859-1,
Windows-1252 or ISO 8859-15. ETS 6 wrote `?` for it in the KNX Smart Touch
S3 (`M-0085_A-0098-12-75FF`, `3F 00 00`); bussard refused the program before
#1065 and now writes `?`. The capture confirms it on a product of our own."""
construct = "TypeText default with a character no Latin code page holds, no TextParameterEncoding"
issues = [1065, 416]

[product]
text = "Nest thermometer display"
order_number = "NEST-WARM"
hardware_name = "NEST-WARM"
hardware_serial = "00FA0027002B"
bus_current = 10

[application]
number = 0x272B
version = 0x10
name = "Nest thermometer display"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Nestthermometeranzeige" }

[application.options]
Comparable = true
Reconstructable = true

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter_type]]
name = "Message"
kind = "text"
size_octets = 14

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

# The construct: a text default with a character no candidate code page
# holds, in a program that declares no TextParameterEncoding.
[[parameter]]
name = "alarm_text"
type = "Message"
text = "Alarm text"
default = "Temp ℃"
memory = { segment = "main", offset = 3, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay", "alarm_text"]
com_objects = [0, 1]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment, MergeId 4 writes it.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 0 }]

[[load_procedure]]
merge_id = 4
ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false }]
