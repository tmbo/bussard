# A synthetic product of the catalogue (#604 row 4), syn-minimal plus one
# construct. Rendered by ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-minimal with `ParameterByteOrder="LittleEndian"` in the application's
Options and four more parameters in the parameter segment, all reached at
their defaults: a signed 16-bit and a signed 32-bit number, a DPT 9 two-octet
float and an IEEE-754 Single float. Every default is non-zero and asymmetric
(0x1234, 0x12345678, 21.5 for both floats), so the octet order of each type
shows in the image ETS writes. Issue #403: bussard writes multi-octet integers
least significant octet first and floats big-endian; the capture decides the
order of DPT 9 and IEEE-754 Single under little-endian separately."""
construct = "ParameterByteOrder LittleEndian with integers and floats"
issues = [403]

[product]
text = "Tree-altitude meter"
order_number = "NEST-ALTI"
hardware_name = "NEST-ALTI"
hardware_serial = "00FA00270004"
bus_current = 10

[application]
number = 0x2704
version = 0x10
name = "Tree-altitude meter"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Baumhöhenmesser" }

[application.options]
Comparable = true
Reconstructable = true
ParameterByteOrder = "LittleEndian"

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter_type]]
name = "Altitude16"
kind = "number"
size_bits = 16
signed = true
min = -32768
max = 32767

[[parameter_type]]
name = "Altitude32"
kind = "number"
size_bits = 32
signed = true
min = -2147483648
max = 2147483647

[[parameter_type]]
name = "Temperature9"
kind = "float"
encoding = "DPT 9"
min = -671088.64
max = 670433.28

[[parameter_type]]
name = "TemperatureSingle"
kind = "float"
encoding = "IEEE-754 Single"
min = -100000
max = 100000

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

# The construct: four parameters after syn-minimal's two, defaults chosen so
# that big- and little-endian octet orders differ.
[[parameter]]
name = "branch_height"
type = "Altitude16"
text = "Branch height (cm)"
default = 4660
memory = { segment = "main", offset = 3, bit_offset = 0 }

[[parameter]]
name = "tree_height"
type = "Altitude32"
text = "Tree height (mm)"
default = 305419896
memory = { segment = "main", offset = 5, bit_offset = 0 }

[[parameter]]
name = "nest_temperature"
type = "Temperature9"
text = "Nest temperature (DPT 9)"
default = 21.5
memory = { segment = "main", offset = 9, bit_offset = 0 }

[[parameter]]
name = "egg_temperature"
type = "TemperatureSingle"
text = "Egg temperature (IEEE single)"
default = 21.5
memory = { segment = "main", offset = 11, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay", "branch_height", "tree_height", "nest_temperature", "egg_temperature"]
com_objects = [0, 1]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment, MergeId 4 writes it.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 0 }]

[[load_procedure]]
merge_id = 4
ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false }]
