# syn-s7-0705 with a Task Pointer Record and a Task Control Record 2 on LSM 3
# (#604 row 17, #527). Rendered by ../generate.py into xml/; see
# ../README.md for the schema.

[doc]
purpose = """
syn-s7-0705 with LdCtrlTaskPtr and LdCtrlTaskCtrl2 on LSM 3, in the corpus
order TaskSegment, TaskPtr, TaskCtrl1, TaskCtrl2 (TaskPtr 40 and TaskCtrl2 59
applications, all on masks 0020/0021/0025, e.g. M-00D1_A-F007-14-86B2-O00E1).
KNX 6 Profiles Annex A.2.4.1 makes both records mandatory on 0701 and 0705.
bussard lowers both since PR #578 (#527) with the KNX 3/5/2 section 3.31.2
layout, subtypes 03h and 05h, but no ETS capture of either record exists,
because no vendor 0705 product uses them. The capture gives the first one:
the octets ETS sends for each record, compared with bussard's."""
construct = "TaskPtr and TaskCtrl2 records on LSM 3"
issues = [527]

[product]
text = "Hunt scheduler"
order_number = "NEST-HUNT"
hardware_name = "NEST-HUNT"
hardware_serial = "00FA00280011"
bus_current = 10

[application]
number = 0x2811
version = 0x10
name = "Hunt scheduler"
mask = "0705"
load_procedure_style = "ProductProcedure"
pei_type = 0
address_table_max_entries = 255
association_table_max_entries = 255
address_table_segment = "address-table"
association_table_segment = "association-table"
com_object_table_segment = "application"
translations = { "de-DE" = "Jagdplaner" }

[application.options]
Comparable = true
Reconstructable = true

# LSM 1: the address table region (dev/system7-spec.md section 2.3).
[[segment]]
name = "address-table"
kind = "absolute"
address = 0x4000
size = 513
memory_type = "EEPROM"
allocate_only = true

# LSM 2: the association table region.
[[segment]]
name = "association-table"
kind = "absolute"
address = 0x4201
size = 511
memory_type = "EEPROM"
allocate_only = true

# LSM 3: the RAM of the com objects: the RAM-flags table at 0x0700, the
# values of objects 0 and 1 at 0x0702 and 0x0703.
[[segment]]
name = "ram"
kind = "absolute"
address = 0x0700
size = 16
memory_type = "RAM"
allocate_only = true

# LSM 3: the application, here only the group-object table (section 7.3):
# count 2, RAM flags at 0x0700, then per object [data ptr][CONFIG][TYPE]:
# switch 0x0702 C W low (0x17), status 0x0703 C R T low (0x4F), both 1 bit.
[[segment]]
name = "application"
kind = "absolute"
address = 0x4400
size = 64
memory_type = "EEPROM"
data = "0207000702170007034f00"
fill = 0xFF

# LSM 3: the parameter image.
[[segment]]
name = "parameters"
kind = "absolute"
address = 0x4440
size = 64
memory_type = "EEPROM"
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "parameters", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "parameters", offset = 1, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay"]
com_objects = [0, 1]

# The whole download of syn-s7-0705 (dev/system7-spec.md section 3):
# the three LSMs torn down, then each loaded with its segments and closed by
# its TaskSegment. Access 0x33, EEPROM (3) with checksum control (0x80); the
# RAM segments Access 0, RAM (2). The stack is SegType 1 behind the RAM.
[[load_procedure]]
ops = [
    { op = "LdCtrlConnect" },
    { op = "LdCtrlUnload", lsm = 1 },
    { op = "LdCtrlUnload", lsm = 2 },
    { op = "LdCtrlUnload", lsm = 3 },
    { op = "LdCtrlLoad", lsm = 1 },
    { op = "LdCtrlAbsSegment", lsm = 1, seg_type = 0, address = 0x4000, size = 513, access = 0x33, mem_type = 3, seg_flags = 0x80 },
    { op = "LdCtrlTaskSegment", lsm = 1, address = 0x4000 },
    { op = "LdCtrlLoadCompleted", lsm = 1 },
    { op = "LdCtrlLoad", lsm = 2 },
    { op = "LdCtrlAbsSegment", lsm = 2, seg_type = 0, address = 0x4201, size = 511, access = 0x33, mem_type = 3, seg_flags = 0x80 },
    { op = "LdCtrlTaskSegment", lsm = 2, address = 0x4201 },
    { op = "LdCtrlLoadCompleted", lsm = 2 },
    { op = "LdCtrlLoad", lsm = 3 },
    { op = "LdCtrlAbsSegment", lsm = 3, seg_type = 0, address = 0x0700, size = 16, access = 0, mem_type = 2, seg_flags = 0 },
    { op = "LdCtrlAbsSegment", lsm = 3, seg_type = 1, address = 0x0710, size = 48, access = 0, mem_type = 2, seg_flags = 0 },
    { op = "LdCtrlAbsSegment", lsm = 3, seg_type = 0, address = 0x4400, size = 64, access = 0x33, mem_type = 3, seg_flags = 0x80 },
    { op = "LdCtrlAbsSegment", lsm = 3, seg_type = 0, address = 0x4440, size = 64, access = 0x33, mem_type = 3, seg_flags = 0x80 },
    { op = "LdCtrlTaskSegment", lsm = 3, address = 0x4400 },
    # The delta (#527): made-up init, save and PEI handler addresses, and a
    # callback, the group-object table and the two segment pointers, each a
    # distinct value so the record's field order shows on the wire.
    { op = "LdCtrlTaskPtr", lsm = 3, init_ptr = 0x4410, save_ptr = 0x4414, serial_ptr = 0x4418 },
    { op = "LdCtrlTaskCtrl1", lsm = 3, address = 0x4430, count = 1 },
    { op = "LdCtrlTaskCtrl2", lsm = 3, callback = 0x441C, address = 0x4400, seg0 = 0x0700, seg1 = 0x4440 },
    { op = "LdCtrlLoadCompleted", lsm = 3 },
    { op = "LdCtrlRestart" },
    { op = "LdCtrlDisconnect" },
]
