# A synthetic product of the catalogue (#604 row 24), syn-minimal plus one
# construct. Rendered by ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-minimal with `TextParameterEncoding="utf-8"` and a third parameter, a
20-octet TypeText at +3, reached in the parameter block, whose `Value` and
`InitialValue` are "Buzzard nest" and whose de-DE `InitialValue` translation
is "Bussardhorst Süd". Regression row for #473 (closed): ETS starts a new
device's text parameter from the `InitialValue` translated into the project
language, so the capture, taken in the sweep's German (de-DE) ETS project,
shows which text ETS writes; the oracle model imports in de-DE too. ETS
6.4.1 wrote the de-DE text in UTF-8, NUL-padded (`... 53 C3 BC 64 00 00
00`), and so does bussard."""
construct = "TypeText with a de-DE InitialValue translation, utf-8"
issues = [473]

[product]
text = "Nest nameplate"
order_number = "NEST-NAME"
hardware_name = "NEST-NAME"
hardware_serial = "00FA00270018"
bus_current = 10

[application]
number = 0x2718
version = 0x10
name = "Nest nameplate"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Nestschild" }

[application.options]
Comparable = true
Reconstructable = true
TextParameterEncoding = "utf-8"

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter_type]]
name = "Name"
kind = "text"
size_octets = 20

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

# The construct: a text parameter whose de-DE InitialValue translation differs
# from its Value and untranslated InitialValue.
[[parameter]]
name = "nest_name"
type = "Name"
text = "Nest name"
default = "Buzzard nest"
initial_value = "Buzzard nest"
translations = { "de-DE" = { initial_value = "Bussardhorst Süd" } }
memory = { segment = "main", offset = 3, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay", "nest_name"]
com_objects = [0, 1]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment, MergeId 4 writes it.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 0 }]

[[load_procedure]]
merge_id = 4
ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false }]
