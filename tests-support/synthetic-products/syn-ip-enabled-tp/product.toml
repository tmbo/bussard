# A synthetic product of the catalogue (#604 row 34), syn-minimal plus one
# construct. Rendered by ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-minimal (mask 07B0, MergedProcedure) on hardware with a KNX IP interface
built in: Hardware IsIPEnabled="true" and AdditionalAddressesCount="2" on the
application, the shape of the 25 IP-enabled 07B0 applications (e.g. the Zennio
ALLinBOX 1612, M-0071_A-4A11-13-48E1). After the application ETS writes the
device's KNXnet/IP parameter object (#455: PIDs 51, 66, 67, 76, 55, 53 in the
sweep). bussard writes the same block from the device's [knxnet] table since
#580; the capture is the first committed one of it and the oracle row's
props= verdict says whether the two match."""
construct = "IP-enabled TP hardware, the KNXnet/IP object writes"
issues = [455]

[product]
text = "Treetop uplink"
order_number = "NEST-UPLINK"
hardware_name = "NEST-UPLINK"
hardware_serial = "00FA002A0022"
ip_enabled = true
bus_current = 10

[application]
number = 0x2A22
version = 0x10
name = "Treetop uplink"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
additional_addresses_count = 2
translations = { "de-DE" = "Wipfelverbindung" }

[application.options]
Comparable = true
Reconstructable = true

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay"]
com_objects = [0, 1]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment, MergeId 4 writes it.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 0 }]

[[load_procedure]]
merge_id = 4
ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false }]
