# A synthetic product of the catalogue (#604 row 25), syn-minimal plus one
# construct. Rendered by ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-minimal with a second ParameterRef of the operating mode parameter that is
never reached, and a <choose> on that second ref. The first ref is shown in
the general block (value 1). The second ref is shown only under a <when
test="0"> of a choose on the first ref, which is not taken at the default.
The choose on the second ref has only a <when default="true">, which shows
com object 2. Issue #563 (closed): ETS decides a choose's activity per
ParameterRef, not per Parameter, so it takes no branch of a choose on a ref
that is not reached even though another ref of the same parameter is (the
Busch-Jaeger fan coil's changeover parameter). The capture is expected to
leave object 2's descriptor at 00 00 in the group-object table, as bussard
plans since #563; a regression row for that rule."""
construct = "choose on the unreached second ParameterRef of a reached parameter"
issues = [563]

[product]
text = "Twin-perch selector"
order_number = "NEST-TWIN"
hardware_name = "NEST-TWIN"
hardware_serial = "00FA00270019"
bus_current = 10

[application]
number = 0x2719
version = 0x10
name = "Twin-perch selector"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Zwillingsstangenwähler" }

[application.options]
Comparable = true
Reconstructable = true

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

# The construct, part 1: a second ref of the operating mode parameter.
[[parameter_ref]]
name = "mode_twin"
parameter = "mode"

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[com_object]]
number = 2
name = "twin"
text = "Twin perch"
function_text = "Twin perch occupied"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay"]
com_objects = [0, 1]

# The construct, part 2: the second ref is shown only when the mode is "off",
# which it is not at the default (1)...
[[dynamic.choose]]
parameter = "mode"

[[dynamic.choose.when]]
test = "0"

[[dynamic.choose.when.block]]
name = "twin_mode"
text = "Twin perch mode"
parameters = ["mode_twin"]
com_objects = []

# ... and a choose on that unreached second ref shows object 2 in its default
# branch. ETS selects no branch of it (#563), so object 2 stays unconfigured.
[[dynamic.choose]]
parameter = "mode_twin"

[[dynamic.choose.when]]
default = true

[[dynamic.choose.when.block]]
name = "twin"
text = "Twin perch"
parameters = []
com_objects = [2]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment, MergeId 4 writes it.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 0 }]

[[load_procedure]]
merge_id = 4
ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false }]
