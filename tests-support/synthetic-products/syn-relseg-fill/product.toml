# Synthetic product #604 row 7 (epic #596): syn-minimal with a Fill octet on
# a Mode 0 relative segment. Rendered by ../generate.py into xml/; see
# ../README.md for the schema.

[doc]
purpose = """
syn-minimal with one change: the application's MergeId 2 block allocates the
parameter segment with `LdCtrlRelSegment Mode="0" Fill="255"`, a fill octet
on a segment whose mode says not to fill (25 corpus applications, all of them
on a partial-download record). The record applies to the full download here,
so the ETS capture shows the two octets ETS puts into the RelSegment
structure for this pair: by the documented layout `00 FF`, where bussard
sends `00 00` today (#480)."""
construct = "RelSegment Mode 0 with Fill 255"
issues = [480]

[product]
text = "Feather filler"
order_number = "NEST-FILL"
hardware_name = "NEST-FILL"
hardware_serial = "00FA00270007"
bus_current = 10

[application]
number = 0x2707
version = 0x10
name = "Feather filler"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Federfüller" }

[application.options]
Comparable = true
Reconstructable = true

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay"]
com_objects = [0, 1]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment (the delta: Mode 0 with Fill 255, #480), MergeId 4 writes it.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 255 }]

[[load_procedure]]
merge_id = 4
ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false }]
