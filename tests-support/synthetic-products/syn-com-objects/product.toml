# A synthetic product of the catalogue (#604 row 27), syn-minimal plus one
# construct. Rendered by ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-minimal with 32 more com objects (2 to 33), all shown: one per object
size from 1 bit to 14 bytes (the 21 sizes of KNX type codes 0 to 20: 1 to 7
bit, 1 to 14 octets), then 1-bit objects, together carrying every
combination of the communication, read, write, transmit and update flags
once; priorities cycle Low, High, Alert; object 23 also has the
read-on-init flag. Regression row for the group-object table descriptors on
System B: priority (#541), the size codes and their range (#545) and the
flag octet (#540). The capture shows the descriptor ETS writes for each;
bussard is expected identical."""
construct = "one com object per size code, every flag combination, three priorities, ReadOnInit"
issues = [541, 545, 540]

[product]
text = "Chirp switchboard"
order_number = "NEST-CHIRP"
hardware_name = "NEST-CHIRP"
hardware_serial = "00FA0027001B"
bus_current = 10

[application]
number = 0x271B
version = 0x10
name = "Chirp switchboard"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Zwitscher-Schaltzentrale" }

[application.options]
Comparable = true
Reconstructable = true

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

# The construct: objects 2 to 22 take the 21 sizes in type-code order, 23 to
