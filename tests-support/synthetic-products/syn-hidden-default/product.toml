# A synthetic product of the catalogue (#604 row 12), syn-minimal plus one
# construct. Rendered by ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-minimal with a third parameter, a 16-bit number at +3 that no parameter
block references (so ETS never shows it), whose default 0x1234 differs from
the segment template (`FF FF`); the application declares neither
`DownloadInvisibleParameters` nor `PreferPartialDownloadIfApplicationLoaded`.
Issue #448: bussard writes such a hidden parameter at its default when the
options are absent; the System 7 sweep rows showed ETS keeping the template.
The capture shows which one ETS does on a System B, schema project/23
product."""
construct = "hidden parameter, default differs from template"
issues = [448]

[product]
text = "Egg heater"
order_number = "NEST-EGGHEAT"
hardware_name = "NEST-EGGHEAT"
hardware_serial = "00FA0027000C"
bus_current = 10

[application]
number = 0x270C
version = 0x10
name = "Egg heater"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Eierwärmer" }

[application.options]
Comparable = true
Reconstructable = true

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

# The construct: a parameter in no block, its default unlike the template FF FF.
[[parameter]]
name = "heater_calibration"
type = "Delay"
text = "Heater calibration"
default = 4660
memory = { segment = "main", offset = 3, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay"]
com_objects = [0, 1]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment, MergeId 4 writes it.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 0 }]

[[load_procedure]]
merge_id = 4
ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false }]
