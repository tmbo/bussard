# A synthetic product of the catalogue (#1065), syn-minimal plus one
# construct. Rendered by ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-minimal with a 16-octet parameter segment allocated with Mode 1, Fill 0
(the device fills it with 00) and written one octet short
(LdCtrlWriteRelMem Size 15), and a 32-bit parameter in the last four octets
whose default 0xC3000000 ends in the fill byte: the Gira push-button rocker
shape (`A-1161-23-518D`, segment 1144, write 1143, `_Allg_Download` at 1140).
ETS wrote C3 and nothing past octet 1143; bussard refused the cut before
#1065 and now cuts it, the last octet held by the fill."""
construct = "parameter in the octet past LdCtrlWriteRelMem Size, held by the fill"
issues = [1065, 564]

[product]
text = "Nest tail marker"
order_number = "NEST-TAIL"
hardware_name = "NEST-TAIL"
hardware_serial = "00FA0027002A"
bus_current = 10

[application]
number = 0x272A
version = 0x10
name = "Nest tail marker"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Nestschwanzmarke" }

[application.options]
Comparable = true
Reconstructable = true

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 16
fill = 0x00

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter_type]]
name = "Marker"
kind = "number"
size_bits = 32
signed = false
min = 0
max = 4294967295

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

# The construct: the last octet of this parameter lies past the write's Size.
[[parameter]]
name = "marker"
type = "Marker"
text = "Download marker"
default = 3271557120
access = "None"
memory = { segment = "main", offset = 12, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay", "marker"]
com_objects = [0, 1]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment, MergeId 4 writes it.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 16, mode = 1, fill = 0 }]

[[load_procedure]]
merge_id = 4
ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 15, verify = false }]
