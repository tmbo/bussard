# Synthetic product #604 row 8 (epic #596): syn-minimal with a <choose> in the
# load procedure whose taken branch writes half the segment. Rendered by
# ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-minimal with one change: a keep-data parameter `keep` (default 1, "keep")
in the first half of the parameter segment, and the application's MergeId 4
block writes the segment through a `<choose>` on it. At the default the taken
branch writes only the first 128 of the 256 octets (`LdCtrlWriteRelMem
Offset="0" Size="128"`); the other branch writes all of it. This is the shape
of #411 (a vendor 07B0 product whose keep-data branch writes part of a
segment), which bussard refuses at plan time because the segment's checks
would need the device's octets in the gap. The ETS capture shows what ETS
writes and verifies for the half-written segment."""
construct = "load-procedure choose writing half the segment"
issues = [411]

[product]
text = "Half-egg warmer"
order_number = "NEST-HALF"
hardware_name = "NEST-HALF"
hardware_serial = "00FA00270008"
bus_current = 10

[application]
number = 0x2708
version = 0x10
name = "Half-egg warmer"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Halbeiwärmer" }

[application.options]
Comparable = true
Reconstructable = true

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter_type]]
name = "Keep"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "overwrite" },
    { value = 1, text = "keep" },
]

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

# The delta, part 1: a keep-data parameter in the first half of the segment.
[[parameter]]
name = "keep"
type = "Keep"
text = "Keep the warming log on download"
default = 1
memory = { segment = "main", offset = 3, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay", "keep"]
com_objects = [0, 1]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment, MergeId 4 writes it. The delta, part 2: the write is a
# <choose> on `keep`; at the default (keep) only the first half is written.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 0 }]

[[load_procedure]]
merge_id = 4
ops = [{ op = "choose", parameter = "keep", when = [
    { test = "1", ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 128, verify = false }] },
    { test = "0", ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false }] },
] }]
