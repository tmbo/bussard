# A synthetic product of the catalogue (#604 row 40, twin), syn-minimal plus one
# construct. Rendered by ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-color-param with `Space="HSV"`: a `<TypeColor Space="HSV">` at +3 of
the parameter segment, reached in the parameter block, with the default
`#FF0000`. Issue #616: bussard places an HSV colour as `HH SS VV` in the
written order (`FF 00 00`); the capture shows whether ETS writes the same
octets for HSV as for RGB. ETS 6.4.1 wrote `00 FF FF`: the value is RGB hex
in both spaces, and ETS stores red as hue 0, saturation and value FF. The
row is `expect=differs` until bussard converts (#616)."""
construct = "TypeColor HSV parameter in memory"
issues = [616]

[product]
text = "Plumage colour lamp HSV"
order_number = "NEST-COLHSV"
hardware_name = "NEST-COLHSV"
hardware_serial = "00FA002700A8"
bus_current = 10

[application]
number = 0x27A8
version = 0x10
name = "Plumage colour lamp HSV"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Gefiederfarblampe HSV" }

[application.options]
Comparable = true
Reconstructable = true

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter_type]]
name = "Colour"
kind = "color"
space = "HSV"

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

# The construct: a HSV colour in memory, reached, default #FF0000.
[[parameter]]
name = "plumage"
type = "Colour"
text = "Plumage colour"
default = "#FF0000"
memory = { segment = "main", offset = 3, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay", "plumage"]
com_objects = [0, 1]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment, MergeId 4 writes it.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 0 }]

[[load_procedure]]
merge_id = 4
ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false }]
