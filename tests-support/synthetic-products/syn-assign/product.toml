# A synthetic product of the catalogue (#604 row 31), syn-minimal plus one
# construct. Rendered by ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-minimal with an <Assign> whose source is the reached delay parameter
(default 300, 01 2C) and whose target is a placed 16-bit parameter at +3 that
no block shows (default 4660, 12 34, over the template FF FF). The Assign
sits in the <when test="1"> of a choose on the operating mode, which is taken
at the default (1). The capture shows whether ETS writes the assigned value
(01 2C) or the target's own default (12 34) at +3. bussard writes the
assigned value: the target of a reached Assign is active and takes the
source's value (#345, the one Dynamic evaluator; sweep cause L). Assign
occurs in 711 corpus applications."""
construct = "Assign from a reached parameter onto an unshown placed one"
issues = [345]

[product]
text = "Chore assigner"
order_number = "NEST-CHORE"
hardware_name = "NEST-CHORE"
hardware_serial = "00FA0027001F"
bus_current = 10

[application]
number = 0x271F
version = 0x10
name = "Chore assigner"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Aufgabenverteiler" }

[application.options]
Comparable = true
Reconstructable = true

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

# The construct, part 1: the target, placed, shown by no block, its default
# unlike both the template and the source's value.
[[parameter]]
name = "chore"
type = "Delay"
text = "Chore interval"
default = 4660
memory = { segment = "main", offset = 3, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay"]
com_objects = [0, 1]

# The construct, part 2: in the taken branch of a choose on the mode, the
# target takes the delay's value.
[[dynamic.block.choose]]
parameter = "mode"

[[dynamic.block.choose.when]]
test = "1"
parameters = []
com_objects = []
assign = [{ target = "chore", source = "delay" }]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment, MergeId 4 writes it.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 0 }]

[[load_procedure]]
merge_id = 4
ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false }]
