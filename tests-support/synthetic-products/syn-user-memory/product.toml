# A synthetic product of the catalogue (#604 row 22), syn-minimal plus one
# construct. Rendered by ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-minimal (07B0, MergedProcedure) with a parameter segment of 8448 octets
on LSM 4 (allocated and written whole) and no SupportsExtendedMemoryServices
in <Options>. The segment does not fit between object 4's base (0x6000) and the
group-object table (0x8000), so knx-sim places it at 0x10000, as a real device
places a large segment above 0xFFFF; 51 corpus applications have such a
segment without the option. Issue #472: on the Zennio DIMinBOX and DALIBOX
rows ETS wrote such a segment with A_UserMemory_Write (20-bit address), where
bussard used A_MemoryExtended_Write. The capture records the service ETS
picks; the twin syn-user-memory-extmem sets the option."""
construct = "segment above 0xFFFF without SupportsExtendedMemoryServices"
issues = [472]

[product]
text = "Big prey larder"
order_number = "NEST-LARDER"
hardware_name = "NEST-LARDER"
hardware_serial = "00FA00270016"
bus_current = 10

[application]
number = 0x2716
version = 0x10
name = "Big prey larder"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Großbeutevorratskammer" }

[application.options]
Comparable = true
Reconstructable = true

# The construct (#472): 8448 octets, more than fit below the association
# table's base, so the device (knx-sim) places the segment at 0x10000.
[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 8448
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay"]
com_objects = [0, 1]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment, MergeId 4 writes it.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 8448, mode = 0, fill = 0 }]

[[load_procedure]]
merge_id = 4
ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 8448, verify = false }]
