[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay"]
com_objects = [0, 1]

# The construct, part 2: a channel with one block; three chooses in it, each
# with a single-value, a list, a comparison and a default branch. At the
# defaults: choose 1 takes "3" and "1 3 5", choose 2 takes ">299", choose 3
# takes only its default branch.
[[dynamic.channel]]
name = "worm"
text = "Worm sensor"
number = "1"

[[dynamic.channel.block]]
name = "worm"
text = "Worm sensor"
parameters = ["sensitivity"]
com_objects = []

[[dynamic.channel.block.choose]]
parameter = "sensitivity"

[[dynamic.channel.block.choose.when]]
test = "3"
parameters = ["single_hit"]
com_objects = [2]

[[dynamic.channel.block.choose.when]]
test = "1 3 5"
parameters = ["list_hit"]
com_objects = [3]

[[dynamic.channel.block.choose.when]]
test = ">=4"
parameters = ["ge_miss"]
com_objects = [4]

[[dynamic.channel.block.choose.when]]
default = true
parameters = ["default_skipped"]
com_objects = [5]

[[dynamic.channel.block.choose]]
parameter = "delay"

[[dynamic.channel.block.choose.when]]
test = "0"
parameters = ["single_miss"]
com_objects = [6]

[[dynamic.channel.block.choose.when]]
test = "100 200"
parameters = ["list_miss"]
com_objects = [7]

[[dynamic.channel.block.choose.when]]
test = ">299"
parameters = ["gt_hit"]
com_objects = [8]

[[dynamic.channel.block.choose.when]]
default = true
parameters = ["default_skipped2"]
com_objects = [9]

[[dynamic.channel.block.choose]]
parameter = "mode"

[[dynamic.channel.block.choose.when]]
test = "0"
parameters = ["single_miss2"]
com_objects = [10]

[[dynamic.channel.block.choose.when]]
test = "0 2"
parameters = ["list_miss2"]
com_objects = [11]

[[dynamic.channel.block.choose.when]]
test = "<1"
parameters = ["lt_miss"]
com_objects = [12]

[[dynamic.channel.block.choose.when]]
default = true
parameters = ["default_taken"]
com_objects = [13]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment, MergeId 4 writes it.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 0 }]

[[load_procedure]]
merge_id = 4
ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false }]
