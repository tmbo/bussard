# A synthetic product of the catalogue (#604 row 28), syn-minimal plus one
# construct. Rendered by ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-minimal with a Channel holding a ParameterBlock, and three <choose>s in
that block whose <when> branches use the four test forms ETS writes: a single
value (test="3"), a value list (test="1 3 5"), a comparison (test=">=4",
">299", "<1") and <when default="true">. Each branch shows one 8-bit
parameter and one com object. At the defaults (sensitivity 3, delay 300,
mode 1) the first choose takes its single and its list branch (two hits, so
not its default), the second its comparison branch, the third only its
default branch. Issue #345 (the one Dynamic evaluator): the group-object
table shows which branches ETS takes, one object per branch (objects 2 to
13); the parameters are written at their defaults whether shown or not
(System B, project/23, as syn-hidden-default showed). bussard's evaluator
takes the same branches, so the row is expected identical; a regression row
for the test forms."""
construct = "Channel and ParameterBlock with choose on single, list, comparison and default tests"
issues = [345]

[product]
text = "Worm-movement detector"
order_number = "NEST-WORM"
hardware_name = "NEST-WORM"
hardware_serial = "00FA0027001C"
bus_current = 10

[application]
number = 0x271C
version = 0x10
name = "Worm-movement detector"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Wurmbewegungsmelder" }

[application.options]
Comparable = true
Reconstructable = true

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter_type]]
name = "Level"
kind = "number"
size_bits = 8
signed = false
min = 0
max = 255

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

