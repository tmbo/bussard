# A synthetic product of the catalogue (#604 row 29), syn-minimal plus one
# construct. Rendered by ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-minimal with a 16-bit union at +3 of the parameter segment whose members
have two types: a 16-bit number (default 2571, `0A 0B`), the union's default
member and reached in the parameter block, and an 8-bit enum at union offset
1 that no block reaches; plus three reached sub-octet parameters packed into
the octet at +5 by `BitOffset`: a 1-bit enum at bit 0 (default 0), a 3-bit
number at bit 1 (default 5) and a 4-bit number at bit 4 (default 6). The
template is `FF`, so every field differs from it. Regression row for the
packing: ETS writes `0A 0B` and `56` (BitOffset counts from the octet's most
significant bit), and bussard must too."""
construct = "16-bit union of two types, sub-octet parameters packed by BitOffset"
issues = [604]

[product]
text = "Feather-bit packer"
order_number = "NEST-BITS"
hardware_name = "NEST-BITS"
hardware_serial = "00FA0027001D"
bus_current = 10

[application]
number = 0x271D
version = 0x10
name = "Feather-bit packer"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Federbitpacker" }

[application.options]
Comparable = true
Reconstructable = true

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter_type]]
name = "Flag"
kind = "enum"
size_bits = 1
values = [
    { value = 0, text = "no" },
    { value = 1, text = "yes" },
]

[[parameter_type]]
name = "Three"
kind = "number"
size_bits = 3
signed = false
min = 0
max = 7

[[parameter_type]]
name = "Nibble"
kind = "number"
size_bits = 4
signed = false
min = 0
max = 15

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

# The construct, part 1: a 16-bit union whose members have two types. The
# 16-bit number is the default member and reached; the enum in its low octet
# is in no block.
[[union]]
name = "feather"
size_bits = 16
memory = { segment = "main", offset = 3, bit_offset = 0 }
default = "feather_count"

[[parameter]]
name = "feather_count"
type = "Delay"
text = "Feather count"
default = 2571
union = { name = "feather", offset = 0, bit_offset = 0 }

[[parameter]]
name = "feather_mode"
type = "Mode"
text = "Feather mode"
default = 2
union = { name = "feather", offset = 1, bit_offset = 0 }

# The construct, part 2: three sub-octet parameters in the octet at +5,
# 0 | 101 | 0110 = 0x56 from the most significant bit.
[[parameter]]
name = "bit_flag"
type = "Flag"
text = "Fluffed"
default = 0
memory = { segment = "main", offset = 5, bit_offset = 0 }

[[parameter]]
name = "bit_three"
type = "Three"
text = "Plume level"
default = 5
memory = { segment = "main", offset = 5, bit_offset = 1 }

[[parameter]]
name = "bit_nibble"
type = "Nibble"
text = "Quill count"
default = 6
memory = { segment = "main", offset = 5, bit_offset = 4 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay", "feather_count", "bit_flag", "bit_three", "bit_nibble"]
com_objects = [0, 1]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment, MergeId 4 writes it.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 0 }]

[[load_procedure]]
merge_id = 4
ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false }]
