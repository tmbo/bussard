# Synthetic product #604 row 10, twin (epic #596): syn-master-reset with
# erase code 4, the KNX Virtual DA.tp sequence. Rendered by ../generate.py into xml/;
# see ../README.md for the schema.

[doc]
purpose = """
The twin of `syn-master-reset` with erase code 4: the application's MergeId 2
block allocates the parameter segment and then sends
`LdCtrlMasterReset EraseCode="4" ChannelNumber="0"`, the sequence of KNX
Virtual's DA.tp (StartLoading, RelSegment, Master Reset, the writes into the
segment). The capture shows the restart form ETS sends to knx-sim (#611) and
that the segment allocated before the reset survives it (#600)."""
construct = "Master Reset erase code 4 after the segment allocation"
issues = [546, 600, 611]

[product]
text = "Deep-cleaning switch"
order_number = "NEST-RESET4"
hardware_name = "NEST-RESET4"
hardware_serial = "00FA0027008A"
bus_current = 10

[application]
number = 0x278A
version = 0x10
name = "Deep-cleaning switch"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Grundreinigungsschalter" }

[application.options]
Comparable = true
Reconstructable = true

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay"]
com_objects = [0, 1]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment and then resets the device (the delta: Master Reset with
# erase code 4, as KNX Virtual's DA.tp places it), MergeId 4 writes it.
[[load_procedure]]
merge_id = 2
ops = [
    { op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 0 },
    { op = "LdCtrlMasterReset", erase_code = 4, channel = 0 },
]

[[load_procedure]]
merge_id = 4
ops = [{ op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false }]
