# A synthetic product of the catalogue (#1054), syn-property-param made KNX
# Data Secure capable the way syn-secure extends syn-minimal. Rendered by
# ../generate.py into xml/; see ../README.md for the schema.

[doc]
purpose = """
syn-property-param (a parameter placed in object 4 PID 201, written by an
LdCtrlWriteProp without InlineData in MergeId 4) with the
[application.security] of syn-secure: IsSecureEnabled="true",
MaxSecurityGroupKeyTableEntries="4" and MaxSecurityIndividualAddressEntries="4".
Nothing else changes. The capture of ETS commissioning it in factory state
(FDSK, tool key, security mode on) and downloading it shows where ETS puts the
security block relative to the PID_PROGRAM_VERSION write and to the property
write of the placed parameter, which syn-secure, with no placed property,
cannot show (#1041)."""
construct = "Data Secure capable, a parameter placed in a property"
issues = [1054, 1041, 669]

[product]
text = "Territory warden"
order_number = "NEST-WARDEN"
hardware_name = "NEST-WARDEN"
hardware_serial = "00FA00290001"
bus_current = 10

[application]
number = 0x2901
version = 0x10
name = "Territory warden"
mask = "07B0"
load_procedure_style = "MergedProcedure"
address_table_max_entries = 32
association_table_max_entries = 32
translations = { "de-DE" = "Revierwächter" }

# KNX Data Secure (#423, #537), as syn-secure.
[application.security]
group_key_table_entries = 4
individual_address_entries = 4

[application.options]
Comparable = true
Reconstructable = true

[[segment]]
name = "main"
kind = "relative"
lsm = 4
size = 256
fill = 0xFF

[[parameter_type]]
name = "Mode"
kind = "enum"
size_bits = 8
values = [
    { value = 0, text = "off" },
    { value = 1, text = "on" },
    { value = 2, text = "automatic" },
]

[[parameter_type]]
name = "Delay"
kind = "number"
size_bits = 16
signed = false
min = 0
max = 65535

[[parameter_type]]
name = "Mark"
kind = "number"
size_bits = 8
signed = false
min = 0
max = 255

[[parameter]]
name = "mode"
type = "Mode"
text = "Operating mode"
default = 1
memory = { segment = "main", offset = 0, bit_offset = 0 }

[[parameter]]
name = "delay"
type = "Delay"
text = "Delay (s)"
default = 300
memory = { segment = "main", offset = 1, bit_offset = 0 }

# The construct: a parameter placed in object 4's PID 201, written by the
# LdCtrlWriteProp below.
[[parameter]]
name = "territory"
type = "Mark"
text = "Territory mark"
default = 90
property = { object_index = 4, property_id = 201, offset = 0, bit_offset = 0 }

[[com_object]]
number = 0
name = "switch"
text = "Switch"
function_text = "On/Off"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "W"]
priority = "Low"

[[com_object]]
number = 1
name = "status"
text = "Status"
function_text = "On/Off status"
size = "1 Bit"
dpt = "DPST-1-1"
flags = ["C", "R", "T"]
priority = "Low"

[[dynamic.block]]
name = "general"
text = "General"
parameters = ["mode", "delay", "territory"]
com_objects = [0, 1]

# The application's part of the 07B0 mask procedure: MergeId 2 allocates the
# parameter segment, MergeId 4 writes it and the property PID 201.
[[load_procedure]]
merge_id = 2
ops = [{ op = "LdCtrlRelSegment", lsm = 4, size = 256, mode = 0, fill = 0 }]

[[load_procedure]]
merge_id = 4
ops = [
    { op = "LdCtrlWriteRelMem", object = 4, offset = 0, size = 256, verify = false },
    { op = "LdCtrlWriteProp", object = 4, prop_id = 201, start_element = 1, count = 1, verify = false },
]
