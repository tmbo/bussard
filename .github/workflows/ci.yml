name: CI

on:
  push:
    # `ci/virtual-device-shakedown` is included temporarily so the interop job
    # can be iterated on its own branch before it is re-blocked and merged.
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR branch).
# On main we still want every push to complete, so the group is keyed by ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation only helps for repeated local rebuilds; in CI every
  # job starts from a cache restore, so it just adds artifacts that bloat the
  # cache and slow linking. Disable it everywhere.
  CARGO_INCREMENTAL: "0"
  # We never debug the binaries in CI, so skip generating debuginfo. Less data
  # to codegen and (especially on Windows/macOS) link. Applies to the dev/test
  # profile used by clippy and the test build.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Fail fast on network flakiness fetching crates instead of hanging.
  CARGO_NET_RETRY: "10"

jobs:
  # fmt + clippy are platform-independent for this pure-Rust workspace, so we
  # run them once on the fastest/cheapest runner (ubuntu) instead of 3x. The
  # per-OS test jobs below no longer run clippy, cutting the biggest cost off
  # the slow Windows runner (clippy was ~75s there).
  lint:
    name: fmt + clippy (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1 # we never need history for lint

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Only write a new cache from main. PR runs restore the main cache
          # read-only, which stops every PR from churning its own cache entry
          # (and evicting others under the 10 GB repo cache budget).
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Shared key so this job reuses the same build cache as the test job
          # on ubuntu — the dev/test profile compilation graph is identical.
          shared-key: rust-ubuntu

      - name: Check formatting
        run: cargo fmt --all --check

      # --all-targets makes clippy compile tests/benches/examples too, which
      # warms the exact same build graph the test job needs. Kept as its own
      # step so a clippy failure is clearly attributed.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # report all platforms' failures, not just the first
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        # No rustfmt/clippy components here: linting lives in the `lint` job.

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # On ubuntu, share the cache with the lint job (same profile/graph),
          # so whichever finishes its build first warms it for the other.
          # macOS/Windows get their own per-OS cache automatically (the action
          # keys on the runner OS + rustc version).
          shared-key: ${{ matrix.os == 'ubuntu-latest' && 'rust-ubuntu' || '' }}

      # nextest runs tests in a process-parallel harness that is meaningfully
      # faster than `cargo test` for a multi-crate workspace, and gives cleaner
      # output. install-action pulls a prebuilt binary (a few seconds), so the
      # install cost is far below the runtime saved.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # The `ci` profile (.config/nextest.toml) does not fail-fast (so every
      # platform reports all its failures), retries flaky real-socket mock tests
      # a couple of times, and enforces a per-test slow-timeout so a hung test
      # cannot wedge the runner. It also emits junit.xml.
      - name: Test (nextest)
        run: cargo nextest run --workspace --profile ci

      # nextest does NOT run doc-tests, so we run them separately to keep the
      # quality gate equivalent (this workspace has real doc-tests). This reuses
      # the compilation already done above, so it is cheap.
      - name: Doc-tests
        run: cargo test --workspace --doc

  # cargo-deny is the automated guard for bussard's central "never GPL"
  # constraint: the license allow-list in deny.toml fails this job if any crate
  # in the dependency tree carries a copyleft (or otherwise unapproved) license.
  # It also fails on known security advisories. Policy lives in deny.toml.
  #
  # This job does not compile the workspace (it only reads Cargo.lock + crate
  # metadata), so it is fast and needs no rustc/cargo cache.
  deny:
    name: cargo-deny (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1 # deny reads Cargo.lock, not history

      - name: cargo-deny
        # Pinned to a tagged release for reproducibility. The action ships a
        # prebuilt cargo-deny binary, so there is nothing to compile here.
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check

  # MSRV gate: the workspace declares rust-version = "1.85", so verify the code
  # still builds on exactly that toolchain. This is `cargo check` only (no
  # tests): it type-checks the whole workspace without paying for codegen +
  # test execution, which is enough to catch use of newer-than-1.85 std/lang
  # features. The `test` matrix already exercises behaviour on stable.
  msrv:
    name: MSRV 1.85 (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Own cache key: the 1.85 build graph differs from the stable one, so
          # it must not share with the rust-ubuntu cache used by lint/test.
          shared-key: rust-msrv-1-85

      - name: cargo check (workspace)
        run: cargo check --workspace

  # Optional interop job: build thelsing/knx's knx-linux-ip demo as an EXTERNAL
  # process and drive bussard's management ladder against it over KNXnet/IP
  # routing multicast. Ubuntu-only (the demo is #ifdef __linux__), and kept OFF
  # the required path: it is its own job name (`virtual-device`) so a flake here
  # does not block a merge, and it is not a dependency of any required job.
  #
  # Licence note: thelsing/knx is GPL and is fetched + built + run as a separate
  # peer here; it is never linked into or vendored by bussard (all bussard crates
  # stay MIT, guarded by the `deny` job). This job compiles that GPL code into a
  # standalone binary at CI time and talks to it over a socket — no linkage.
  virtual-device:
    name: virtual-device (ubuntu, interop)
    runs-on: ubuntu-latest
    # First-execution shakedown in progress (same-host multicast delivery);
    # non-blocking until the ladder is proven stable on runners.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Reuse the ubuntu build graph warmed by lint/test.
          shared-key: rust-ubuntu

      # Cache the built external device binary keyed on the pinned commit, so a
      # green run does not re-clone/rebuild thelsing/knx every time. The key must
      # track the pin in build.sh; bump it there and this cache misses once.
      - name: Cache virtual-device build
        id: vdev-cache
        uses: actions/cache@v4
        with:
          path: target/virtual-device
          key: vdev-thelsing-980c047ad7fc5e27bf2fae95e48acde5d5e0b4fd

      - name: Build the virtual device (thelsing/knx knx-linux-ip)
        run: tests-support/virtual-device/build.sh

      # Root cause of the first-run failure: thelsing's Linux platform hard-codes
      # IP_MULTICAST_LOOP=0 on its multicast socket, so its routing replies are
      # NOT delivered to a bussard on the same host (that loop flag gates
      # same-host multicast delivery on Linux). We put the device in its own
      # network namespace joined to the root ns by a veth pair, so its multicast
      # crosses a real link as inbound traffic — where the loop flag no longer
      # applies. See tests-support/virtual-device/netns-setup.sh for the detail.
      - name: Set up device network namespace (veth)
        run: |
          sudo tests-support/virtual-device/netns-setup.sh | tee netns.env
          echo "--- root-ns multicast state ---"
          ip maddr show || true
          ip route show | grep -i 224 || true

      # Diagnostics: capture the multicast exchange in the background so a failing
      # run has a packet-level record. `any` catches both the veth and any stray
      # eth0 traffic. Killed after the ladder; the pcap is uploaded as an artifact.
      - name: Start tcpdump (background)
        run: |
          sudo tcpdump -i any -w vdev.pcap 'udp port 3671' &
          echo $! | sudo tee /tmp/tcpdump.pid >/dev/null
          # Also capture INSIDE the device namespace on ALL interfaces (so we see
          # both knxveth1 and lo), to observe whether the device receives
          # bussard's broadcast AND whether/where it transmits a reply — thelsing
          # sets no IP_MULTICAST_IF, so a reply could egress the wrong interface.
          sudo ip netns exec knxdev tcpdump -i any -w vdev-netns.pcap 'udp port 3671' &
          echo $! | sudo tee /tmp/tcpdump-netns.pid >/dev/null
          sleep 1  # let them bind before traffic starts

      # Permanent interop diagnostic (bussard-independent). Boots the device in
      # the namespace and, from a plain socket in the root ns, exercises the KNX
      # management protocol directly. It establishes three facts that scope any
      # ladder failure precisely:
      #   1. veth multicast carries the routing group both directions;
      #   2. the device is reachable CONNECTION-ORIENTED at its default address
      #      15.15.255 and answers property reads/writes (incl. PID_PROG_MODE);
      #   3. whether the device answers the BROADCAST A_IndividualAddress_Read
      #      that `bussard assign` relies on (rung a) — the known interop wall:
      #      this pinned thelsing knx-linux-ip does NOT, even with programming
      #      mode confirmed on (see tests-support/virtual-device/README.md).
      # This is a probe, never a gate — it always exits 0.
      - name: Interop protocol diagnostic (raw KNX)
        run: |
          BIN="$(cat target/virtual-device/binary-path.txt)"
          workdir="$(mktemp -d)"
          sudo ip netns exec knxdev stdbuf -oL -eL "$BIN" >"$workdir/repro-dev.log" 2>&1 &
          for i in $(seq 1 50); do
            sudo ip netns exec knxdev ip maddr show | grep -q 224.0.23.12 && break
            sleep 0.2
          done
          sleep 1
          python3 tests-support/virtual-device/knx_probe.py || true
          echo "--- device log ---"; cat "$workdir/repro-dev.log" || true
          sudo pkill -f knx-linux-ip 2>/dev/null || true
          sleep 1

      # Pre-flight: prove the device actually boots inside the namespace and
      # joins the multicast group, before the Rust harness drives it. This
      # isolates "device won't start / won't join" from "bussard can't reach it".
      # We run it briefly, capture its output (line-buffered), and inspect the
      # namespace's multicast memberships.
      - name: Pre-flight the device in the namespace
        run: |
          BIN="$(cat target/virtual-device/binary-path.txt)"
          workdir="$(mktemp -d)"
          echo "pre-flight workdir: $workdir"
          # Line-buffer so the startup banner reaches the log even though stdout
          # is a file, not a tty.
          sudo ip netns exec knxdev stdbuf -oL -eL "$BIN" >"$workdir/preflight.log" 2>&1 &
          devpid=$!
          sleep 4
          echo "--- device preflight.log ---"
          cat "$workdir/preflight.log" || true
          echo "--- namespace multicast memberships (ip maddr) ---"
          sudo ip netns exec knxdev ip maddr show || true
          echo "--- namespace UDP sockets (ss -lun) ---"
          sudo ip netns exec knxdev ss -lun || true
          echo "--- is the device still alive? ---"
          if sudo kill -0 "$devpid" 2>/dev/null; then echo "yes (pid $devpid)"; else echo "NO — it exited"; fi
          sudo kill "$devpid" 2>/dev/null || true
          sudo pkill -f knx-linux-ip 2>/dev/null || true

      - name: Run the interop ladder
        env:
          BUSSARD_VIRTUAL_DEVICE: "1"
          BUSSARD_TEST_MULTICAST: "1"
        run: |
          BIN="$(cat target/virtual-device/binary-path.txt)"
          echo "device binary: $BIN"
          # The device is spawned by the test through this wrapper, which drops it
          # into the netns created above. `sudo` is needed for `ip netns exec`.
          # stdbuf keeps the device's stdout line-buffered so its banner reaches
          # dev.log even though stdout is a file.
          export BUSSARD_VIRTUAL_DEVICE_WRAP="sudo ip netns exec knxdev stdbuf -oL -eL"
          # Readiness = the device has actually JOINED the routing group (not just
          # printed its banner). This closes the join race: the banner prints
          # before knx.start() joins the group, and the assign fires a single
          # broadcast with no retransmit, so sending before the join silently
          # misses. Wait until 224.0.23.12 appears in the namespace's memberships.
          export BUSSARD_VIRTUAL_DEVICE_READY_CMD="sudo ip netns exec knxdev ip maddr show | grep -q 224.0.23.12"
          BUSSARD_VIRTUAL_DEVICE_BIN="$BIN" \
            cargo test -p bussard-cli --test virtual_device -- --ignored --nocapture

      - name: Stop tcpdump and dump capture summary
        if: always()
        run: |
          sudo kill "$(cat /tmp/tcpdump.pid)" 2>/dev/null || true
          sudo kill "$(cat /tmp/tcpdump-netns.pid)" 2>/dev/null || true
          sleep 1
          echo "--- root-ns pcap summary (udp/3671) ---"
          sudo tcpdump -n -r vdev.pcap 2>/dev/null | head -80 || true
          echo "--- device-netns pcap summary (udp/3671) ---"
          sudo tcpdump -n -r vdev-netns.pcap 2>/dev/null | head -80 || true

      - name: Collect device logs
        if: always()
        run: |
          # The test writes each device's stdout/stderr to dev.log in a temp dir
          # (bussard-vdev-dev-*). Gather any that survived for the artifact.
          mkdir -p vdev-logs
          find "${TMPDIR:-/tmp}" -maxdepth 2 -name dev.log -path '*bussard-vdev-*' \
            -exec cp {} vdev-logs/ \; 2>/dev/null || true
          echo "--- collected device logs ---"
          for f in vdev-logs/*; do echo "== $f =="; cat "$f"; done 2>/dev/null || true

      - name: Upload interop diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: virtual-device-diagnostics
          path: |
            vdev.pcap
            vdev-netns.pcap
            vdev-logs/
            netns.env
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down device network namespace
        if: always()
        run: |
          sudo pkill -f knx-linux-ip 2>/dev/null || true
          sudo tests-support/virtual-device/netns-setup.sh --teardown || true

  # Full-flash oracle: drive `bussard flash` (the ETS-free application download)
  # against thelsing/knx's knx-linux-ip as an EXTERNAL peer over KNXnet/IP routing
  # multicast, and assert the device's ApplicationProgram object reaches Loaded.
  #
  # This reaches what the management ladder (`virtual-device`) could not: the
  # ladder stops at rung (a) because a factory-fresh thelsing device boots at
  # 15.15.255 and never enters programming mode, so `assign`'s broadcast discovery
  # finds nothing. Flash does not need discovery — it opens a connection-oriented
  # session to a KNOWN address (15.15.255) and downloads there, which the
  # bussard-independent knx_probe.py proved is reachable. So this job flashes the
  # device at 15.15.255 directly.
  #
  # Same licence framing as `virtual-device`: thelsing/knx is GPL, fetched + built
  # + run as a separate process here, never linked into or vendored by bussard.
  # Kept OFF the required path (own job name, continue-on-error) so an interop
  # flake never blocks a merge.
  virtual-device-flash:
    name: virtual-device-flash (ubuntu, interop)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: rust-ubuntu

      # Reuse the same pinned-commit build cache the `virtual-device` job warms.
      - name: Cache virtual-device build
        id: vdev-cache
        uses: actions/cache@v4
        with:
          path: target/virtual-device
          key: vdev-thelsing-980c047ad7fc5e27bf2fae95e48acde5d5e0b4fd

      - name: Build the virtual device (thelsing/knx knx-linux-ip)
        run: tests-support/virtual-device/build.sh

      # thelsing hard-codes IP_MULTICAST_LOOP=0, so same-host multicast delivery
      # of its replies fails. Put the device in its own netns joined by a veth, so
      # its multicast crosses a real link (where the loop flag no longer applies).
      - name: Set up device network namespace (veth)
        run: |
          sudo tests-support/virtual-device/netns-setup.sh | tee netns.env
          echo "--- root-ns multicast state ---"
          ip maddr show || true
          ip route show | grep -i 224 || true

      - name: Start tcpdump (background)
        run: |
          sudo tcpdump -i any -w vdev-flash.pcap 'udp port 3671' &
          echo $! | sudo tee /tmp/tcpdump-flash.pid >/dev/null
          sudo ip netns exec knxdev tcpdump -i any -w vdev-flash-netns.pcap 'udp port 3671' &
          echo $! | sudo tee /tmp/tcpdump-flash-netns.pid >/dev/null
          sleep 1

      - name: Run the flash oracle
        env:
          BUSSARD_VIRTUAL_DEVICE: "1"
          BUSSARD_TEST_MULTICAST: "1"
        run: |
          BIN="$(cat target/virtual-device/binary-path.txt)"
          echo "device binary: $BIN"
          # The test spawns the device through this wrapper into the netns.
          export BUSSARD_VIRTUAL_DEVICE_WRAP="sudo ip netns exec knxdev stdbuf -oL -eL"
          # Readiness = the device has JOINED the routing group (closes the join
          # race), same as the ladder job.
          export BUSSARD_VIRTUAL_DEVICE_READY_CMD="sudo ip netns exec knxdev ip maddr show | grep -q 224.0.23.12"
          BUSSARD_VIRTUAL_DEVICE_BIN="$BIN" \
            cargo test -p bussard-cli --test virtual_device_flash -- --ignored --nocapture

      - name: Stop tcpdump and dump capture summary
        if: always()
        run: |
          sudo kill "$(cat /tmp/tcpdump-flash.pid)" 2>/dev/null || true
          sudo kill "$(cat /tmp/tcpdump-flash-netns.pid)" 2>/dev/null || true
          sleep 1
          echo "--- root-ns pcap summary (udp/3671) ---"
          sudo tcpdump -n -r vdev-flash.pcap 2>/dev/null | head -120 || true
          echo "--- device-netns pcap summary (udp/3671) ---"
          sudo tcpdump -n -r vdev-flash-netns.pcap 2>/dev/null | head -120 || true

      - name: Collect device logs
        if: always()
        run: |
          mkdir -p vdev-flash-logs
          find "${TMPDIR:-/tmp}" -maxdepth 2 -name dev.log -path '*bussard-vdev-flash-*' \
            -exec cp {} vdev-flash-logs/ \; 2>/dev/null || true
          echo "--- collected device logs ---"
          for f in vdev-flash-logs/*; do echo "== $f =="; cat "$f"; done 2>/dev/null || true

      - name: Upload flash interop diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: virtual-device-flash-diagnostics
          path: |
            vdev-flash.pcap
            vdev-flash-netns.pcap
            vdev-flash-logs/
            netns.env
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down device network namespace
        if: always()
        run: |
          sudo pkill -f knx-linux-ip 2>/dev/null || true
          sudo tests-support/virtual-device/netns-setup.sh --teardown || true
