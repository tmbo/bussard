# Release builds: pushing a version tag (e.g. `0.1.0` or `v0.1.0`) creates a
# GitHub Release with prebuilt binaries for the three platforms attached.
# The README links to the releases page for downloads.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  create-release:
    name: create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Verify the tag matches the crate version
        shell: bash
        run: |
          # Guard against a mistagged release shipping a binary that misreports
          # --version (issue #75). Compare the pushed tag (minus a leading `v`)
          # to the workspace version from cargo metadata.
          tag="${{ github.ref_name }}"
          tag="${tag#v}"
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="bussard-cli") | .version')"
          echo "tag=$tag crate version=$version"
          if [ -z "$version" ]; then
            echo "::error::could not read bussard-cli version from cargo metadata"
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "::error::tag '$tag' does not match crate version '$version'; \
          refusing to release a binary that would misreport --version. \
          Bump the version in Cargo.toml or push a matching tag."
            exit 1
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --generate-notes \
              --title "bussard ${{ github.ref_name }}"

  build:
    name: build (${{ matrix.os }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: bussard-windows-x64.exe
            path: target/release/bussard.exe
            # Static CRT: must run on a bare Windows without the VC++
            # redistributable (single-binary install story).
            rustflags: "-C target-feature=+crt-static"
          - os: macos-latest
            asset: bussard-macos-arm64
            path: target/release/bussard
          - os: ubuntu-latest
            asset: bussard-linux-x64
            path: target/release/bussard
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-build
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        run: cargo build --release -p bussard-cli
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp "${{ matrix.path }}" "${{ matrix.asset }}"
          # shasum is absent in Windows git-bash; sha256sum is absent on macOS.
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          gh release upload "${{ github.ref_name }}" \
            "${{ matrix.asset }}" "${{ matrix.asset }}.sha256" --clobber
