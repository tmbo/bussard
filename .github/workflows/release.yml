# Release builds: pushing a version tag (e.g. `0.1.0` or `v0.1.0`) creates a
# GitHub Release with prebuilt binaries for five platform/arch pairs attached.
# The README links to the releases page for downloads.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

# A retagged release must not race its own earlier run: two runs uploading the
# same asset names with `--clobber` can interleave and leave a mixed set of
# binaries on the release. Serialize per tag instead, and let the newer run win.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  create-release:
    name: create release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
      - name: Verify the tag matches the crate version
        shell: bash
        run: |
          # Guard against a mistagged release shipping a binary that misreports
          # --version (issue #75). Compare the pushed tag (minus a leading `v`)
          # to the workspace version from cargo metadata.
          tag="${{ github.ref_name }}"
          tag="${tag#v}"
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="bussard-cli") | .version')"
          echo "tag=$tag crate version=$version"
          if [ -z "$version" ]; then
            echo "::error::could not read bussard-cli version from cargo metadata"
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "::error::tag '$tag' does not match crate version '$version'; \
          refusing to release a binary that would misreport --version. \
          Bump the version in Cargo.toml or push a matching tag."
            exit 1
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::a release named '$tag' already exists; delete it or pick another version"
            exit 1
          fi
          # Release notes are the tag's section of CHANGELOG.md (folded from
          # changelog.d by scripts/changelog.py collect before tagging).
          version="${tag#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section; run scripts/changelog.py collect and name the section before tagging"
            exit 1
          fi
          # GitHub caps a release body at 125 000 characters; a first release
          # folded from hundreds of fragments is longer. Keep whole lines up
          # to 100 000 bytes and point at the full entry in CHANGELOG.md.
          if [ "$(wc -c < release-notes.md)" -gt 100000 ]; then
            head -c 100000 release-notes.md | sed '$d' > release-notes.cut
            # GitHub's heading anchor: lowercase, drop everything but letters,
            # digits, spaces and hyphens, spaces to hyphens.
            anchor="$(grep -m1 "^## \\[$version\\]" CHANGELOG.md | sed 's/^## //' \
              | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9 -]//g; s/ /-/g')"
            printf '\n\n*The notes are cut here. The full entry is `## [%s]` in [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md#%s).*\n' \
              "$version" "${{ github.repository }}" "$tag" "$anchor" >> release-notes.cut
            mv release-notes.cut release-notes.md
          fi
          gh release create "$tag" --notes-file release-notes.md \
            --title "bussard $tag"

  build:
    name: build (${{ matrix.asset }})
    needs: create-release
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: bussard-windows-x64.exe
            path: target/release/bussard.exe
            # Static CRT: must run on a bare Windows without the VC++
            # redistributable (single-binary install story).
            rustflags: "-C target-feature=+crt-static"
          - os: macos-latest
            asset: bussard-macos-arm64
            path: target/release/bussard
          # macos-latest is Apple silicon; the Xcode toolchain cross-compiles
          # x86_64 out of the box, so Intel Macs get a binary without needing a
          # (shrinking, soon-retired) Intel macOS runner.
          - os: macos-latest
            asset: bussard-macos-x64
            target: x86_64-apple-darwin
            path: target/x86_64-apple-darwin/release/bussard
          - os: ubuntu-latest
            asset: bussard-linux-x64
            path: target/release/bussard
          # Native arm64 Linux runner (free on public repos): rusqlite's bundled
          # SQLite and ring both compile C/asm, so a native runner is simpler and
          # greener than wrangling a cross C toolchain.
          - os: ubuntu-24.04-arm
            asset: bussard-linux-arm64
            path: target/release/bussard
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch)
        with:
          targets: ${{ matrix.target || '' }}
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-build-${{ matrix.asset }}
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        # bash on every runner: PowerShell on windows-latest rejects the
        # line continuation below (0.9.0 run 42198174048).
        shell: bash
        run: |
          cargo build --release -p bussard-cli \
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp "${{ matrix.path }}" "${{ matrix.asset }}"
          # shasum is absent in Windows git-bash; sha256sum is absent on macOS.
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          gh release upload "${{ github.ref_name }}" \
            "${{ matrix.asset }}" "${{ matrix.asset }}.sha256" --clobber

  # Homebrew tap. The job needs a token for a repository outside this one, so
  # it is a no-op until the maintainer adds the secret (packaging/README.md has
  # the one-time setup). A missing secret skips the job with a notice rather
  # than failing the release.
  homebrew:
    name: update the Homebrew tap
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # `secrets` is not available in a job-level `if`, so read it into the env
      # and gate the steps on that instead.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Skip without a tap token
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: |
          echo "::notice::HOMEBREW_TAP_TOKEN is not set, so the Homebrew tap was \
          not updated. Create tmbo/homebrew-tap and add the secret; see \
          packaging/README.md."
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          fetch-depth: 1
      - name: Render the formula from the release checksums
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          mkdir -p dist
          for a in macos-arm64 macos-x64 linux-x64 linux-arm64; do
            gh release download "$tag" --repo "${{ github.repository }}" \
              --pattern "bussard-$a.sha256" --dir dist
          done
          sha() { cut -d ' ' -f 1 < "dist/bussard-$1.sha256"; }
          sed -e "s|@VERSION@|$version|g" \
              -e "s|@TAG@|$tag|g" \
              -e "s|@SHA256_MACOS_ARM64@|$(sha macos-arm64)|" \
              -e "s|@SHA256_MACOS_X64@|$(sha macos-x64)|" \
              -e "s|@SHA256_LINUX_X64@|$(sha linux-x64)|" \
              -e "s|@SHA256_LINUX_ARM64@|$(sha linux-arm64)|" \
              Formula/bussard.rb > rendered-bussard.rb
          if grep -q '@[A-Z0-9_]*@' rendered-bussard.rb; then
            echo "::error::the formula still has unsubstituted placeholders"
            grep -n '@[A-Z0-9_]*@' rendered-bussard.rb
            exit 1
          fi
          cat rendered-bussard.rb
      - name: Push the formula to tmbo/homebrew-tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#v}"
          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/tmbo/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp rendered-bussard.rb tap/Formula/bussard.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/bussard.rb
          if git diff --cached --quiet; then
            echo "tap already up to date"
            exit 0
          fi
          git commit -m "bussard $version"
          git push
