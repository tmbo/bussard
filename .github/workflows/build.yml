# Manually triggered release-style builds: downloadable bussard binaries per
# platform (workflow_dispatch), e.g. a Windows .exe for testing against KNX
# Virtual inside a VM.
name: Build binaries

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: bussard-windows-x64
            path: target/release/bussard.exe
            # Static CRT: the exe must run on a bare Windows without the VC++
            # redistributable (single-binary install story).
            rustflags: "-C target-feature=+crt-static"
          - os: macos-latest
            artifact: bussard-macos-arm64
            path: target/release/bussard
          # macos-latest is Apple silicon; cross-compile the Intel Mac binary
          # here so release.yml's x86_64-apple-darwin row can't break in secret.
          - os: macos-latest
            artifact: bussard-macos-x64
            target: x86_64-apple-darwin
            path: target/x86_64-apple-darwin/release/bussard
          - os: ubuntu-latest
            artifact: bussard-linux-x64
            path: target/release/bussard
          # Native arm64 Linux runner (free on public repos), mirroring release.yml.
          - os: ubuntu-24.04-arm
            artifact: bussard-linux-arm64
            path: target/release/bussard
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-build-${{ matrix.artifact }}
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        run: |
          cargo build --release -p bussard-cli \
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          retention-days: 14
