# Manually triggered release-style builds: downloadable bussard binaries per
# platform (workflow_dispatch), e.g. a Windows .exe for testing against KNX
# Virtual inside a VM.
name: Build binaries

on:
  workflow_dispatch:

# Nothing here writes to the repository: it builds binaries and uploads them as
# run artifacts, which needs no repository write scope.
permissions:
  contents: read

# One build per ref at a time. A second dispatch supersedes the first rather
# than racing it for the same artifact names.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: bussard-windows-x64
            path: target/release/bussard.exe
            # Static CRT: the exe must run on a bare Windows without the VC++
            # redistributable (single-binary install story).
            rustflags: "-C target-feature=+crt-static"
          - os: macos-latest
            artifact: bussard-macos-arm64
            path: target/release/bussard
          # macos-latest is Apple silicon; cross-compile the Intel Mac binary
          # here so release.yml's x86_64-apple-darwin row can't break in secret.
          - os: macos-latest
            artifact: bussard-macos-x64
            target: x86_64-apple-darwin
            path: target/x86_64-apple-darwin/release/bussard
          - os: ubuntu-latest
            artifact: bussard-linux-x64
            path: target/release/bussard
          # Native arm64 Linux runner (free on public repos), mirroring release.yml.
          - os: ubuntu-24.04-arm
            artifact: bussard-linux-arm64
            path: target/release/bussard
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch)
        with:
          targets: ${{ matrix.target || '' }}
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-build-${{ matrix.artifact }}
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        run: |
          cargo build --release -p bussard-cli \
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          retention-days: 14
