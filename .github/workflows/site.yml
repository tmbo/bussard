# Builds the website (landing page, rendered docs, the /enroll/ moved notice)
# and deploys it to GitHub Pages. See website/README.md. The enrolment page
# itself is served by the relay Worker (services/enroll-relay, #797), not from
# here. Requires Pages to be set to "GitHub Actions" as its source in the
# repository settings.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Deploying to Pages needs the OIDC token and the pages scope; nothing here
# writes to the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt

      # requirements.txt pins every package with its hashes; regenerate it
      # from requirements.in as website/README.md shows.
      - name: Install MkDocs Material
        run: pip install --require-hashes --no-deps -r website/requirements.txt

      - name: Build
        run: |
          mkdir -p _site
          cp website/index.html _site/
          # A plain notice where the enrolment page used to be (#797).
          cp -R website/enroll _site/enroll
          mkdocs build --strict -f website/mkdocs.yml -d "$PWD/_site/docs"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
