# Documentation site: renders the Markdown in ../docs with MkDocs Material.
# Built by .github/workflows/site.yml together with index.html (the landing
# page) and deployed to GitHub Pages. Local preview:
#   uvx --from mkdocs-material mkdocs serve -f website/mkdocs.yml
site_name: bussard docs
site_url: https://bussard.tmbo.dev/docs/
site_description: Open-source CLI for KNX. Configuration in TOML, programming over KNXnet/IP, live decoding of the bus.
repo_url: https://github.com/tmbo/bussard
repo_name: tmbo/bussard
edit_uri: edit/main/docs/
docs_dir: ../docs
copyright: bussard is an independent project, not affiliated with or certified by the KNX Association. KNX is a registered trademark of the KNX Association.

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Instrument Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link

extra:
  # The logo and title link back to the landing page, not the docs index.
  homepage: https://bussard.tmbo.dev/

extra_css:
  - assets/stylesheets/site.css

extra_javascript:
  - assets/javascripts/copy-commands.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # heading anchors use GitHub's slug style, set in hooks.py (on_config)
  - pymdownx.details
  - pymdownx.highlight:
      # marks a block with its language (`language-console`), which the copy
      # button script uses to copy only the commands
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

hooks:
  - hooks.py

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Your first project: getting-started/first-model.md
      - Connect an assistant: getting-started/assistant.md
      - The first weekend: getting-started/first-weekend.md
  - How-to guides:
      - how-to/index.md
      - Watch the bus: how-to/watch-the-bus.md
      - Find what you have: how-to/find-what-you-have.md
      - Change what a button does: how-to/change-a-link.md
      - Change a parameter: how-to/change-a-parameter.md
      - Add a device: how-to/add-a-device.md
      - Back up and replace: how-to/back-up-and-replace.md
      - Commission a line: how-to/commission-a-line.md
      - Exchange with ETS: how-to/exchange-with-ets.md
      - Work with an integrator: how-to/work-with-an-integrator.md
      - Home Assistant: how-to/home-assistant.md
      - KNX Secure: how-to/knx-secure.md
  - Reference:
      - reference/index.md
      - Global options: reference/global-options.md
      - Environment variables: reference/environment.md
      - Commands:
          - Project: reference/commands/model.md
          - Bus: reference/commands/bus.md
          - Devices: reference/commands/devices.md
          - Programming: reference/commands/programming.md
          - KNX Secure: reference/commands/secure.md
          - History: reference/commands/history.md
          - Servers: reference/commands/servers.md
      - Files:
          - bussard.toml: reference/files/bussard-toml.md
          - groups.toml: reference/files/groups-toml.md
          - Device files: reference/files/device-files.md
          - bussard.lock: reference/files/bussard-lock.md
          - bussard.keys: reference/files/bussard-keys.md
          - tests.toml: reference/files/tests-toml.md
          - ha.toml: reference/files/ha-toml.md
          - Errors: reference/files/errors.md
      - The project folder: reference/model-directory.md
      - Validation diagnostics: reference/diagnostics.md
      - JSON output: reference/json-output.md
      - MCP tools: reference/mcp-tools.md
      - viz API: reference/viz-api.md
      - Product data: reference/product-data.md
      - Home Assistant: reference/home-assistant.md
  - Explanation:
      - explanation/index.md
      - How bussard works: explanation/how-it-works.md
      - Safety: explanation/safety.md
      - Write commands: explanation/write-commands.md
      - KNX Secure: explanation/knx-secure.md
      - The assistant: explanation/assistant.md
      - Device support: explanation/device-support.md
