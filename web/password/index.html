<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The project password form (#818): served by bussard's MCP server on
       127.0.0.1 under a random token path. bussard fills the double-brace
       placeholders (escaped) and sends the same policy as a header, with
       frame-ancestors. No script, no third-party request; the form posts
       to this page only. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>bussard: project password</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="password.css">
</head>
<body>
  <main>
    <header class="top">
      <span class="brand">bussard</span>
      <span class="title">ETS project password</span>
    </header>
    <section class="panel">
      {{message}}
      {{form}}
    </section>
    <p class="muted small">This page is served by bussard on this computer.
      The password goes to bussard only, never into the chat.</p>
  </main>
</body>
</html>
